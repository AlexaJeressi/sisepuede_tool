# Guided widgets for transformer parameters that take a dict or a list of
# categories (see services/param_schema_service.py).
#
# Keyed by transformer_code -> parameter_name. Fields:
#   widget:   shares  -- one % per key; values are fractions in sisepuede
#             values  -- one number per key (`unit`: share -> shown as %, else as is)
#             bounds  -- one min and one max per key ({"key|min": v, "key|max": v})
#             pairs   -- rows of (output key, input key, value) -> {out: {in: v}}
#             multi   -- multi-select of categories (list)
#             select  -- single category (string)
#             note    -- no input, only the `help` text (parameter not sent)
#   keys:     {table: <cat table>} for every category of a ModelAttributes
#             table (dict_attributes["cat"]), plus `only: [...]` for a subset.
#             `pairs` use `keys_out` / `keys_in`.
#   unit:     share | percent_change | ha | ratio
#   sum_rule: eq1 (must total 100%) | leq1 (at most 100%) | none
#   default:  what sisepuede uses when the parameter is not set (the
#             signature default is often None and the real default is built
#             inside the function). Pre-fills the table.
#   label / help / tier: shown in the editor; tier defaults to advanced.
#
# Written from a read of sisepuede (biomass_fix) transformer_kernels.py and
# transformers/lib/_baselib_*.py on 2026-10-04. Key subsets are checked
# against the attribute tables by tests/test_param_schema_service.py.

_fuels_trns: &fuels_trns
  table: fuel
  only: [fuel_biofuels, fuel_diesel, fuel_electricity, fuel_gasoline, fuel_hydrocarbon_gas_liquids, fuel_hydrogen, fuel_kerosene, fuel_natural_gas]

_fuels_trns_maritime: &fuels_trns_maritime
  table: fuel
  only: [fuel_ammonia, fuel_biofuels, fuel_diesel, fuel_electricity, fuel_gasoline, fuel_hydrocarbon_gas_liquids, fuel_hydrogen, fuel_kerosene, fuel_natural_gas]

_fuels_scoe: &fuels_scoe
  table: fuel
  only: [fuel_biomass, fuel_charcoal, fuel_coal, fuel_diesel, fuel_electricity, fuel_gasoline, fuel_hydrocarbon_gas_liquids, fuel_hydrogen, fuel_kerosene, fuel_natural_gas]

_ind_ccs: &ind_ccs
  table: industry
  only: [cement, chemicals, glass, lime_and_carbonite, metals, plastic]

_lsmm_help: &lsmm_help >-
  Share of manure from the selected animals handled by each system in the final
  year. Systems you leave blank lose share in proportion. The total can't be
  above 100%: sisepuede ignores the whole transformation if it is.

_wali_help: &wali_help >-
  Share of this wastewater stream treated by each pathway in the final year.
  Pathways you leave blank shrink in proportion. The total can't be above 100%:
  sisepuede ignores the whole transformation if it is.

_fuel_alloc_help: &fuel_alloc_help >-
  How the fuel use that is shifted is split among the new fuels. Must total
  exactly 100%; otherwise sisepuede silently uses its default split.

# ---------------------------------------------------------------- AFOLU

TFR:AGRC:TARGET_RESIDUE_MANAGEMENT:
  dict_categories_to_magnitude:
    widget: values
    label: No-till share of cropland by the final year
    help: >-
      Minimum share of each crop's land under no-till (conservation
      agriculture). Only these six crops have a no-till variable; blank crops
      keep their current share.
    keys: {table: agriculture, only: [cereals, fibers, other_annual, pulses, tubers, vegetables_and_vines]}
    unit: share
    sum_rule: none
    default: {cereals: 0.8, fibers: 0.8, other_annual: 0.8, pulses: 0.5, tubers: 0.5, vegetables_and_vines: 0.5}
    tier: basic
  include_conservation_agriculture:
    label: Apply conservation agriculture
    help: Keep this on; with it off the installed sisepuede version fails.
  magnitude_burned:
    widget: note
    label: Residues burned
    tier: advanced
    help: Has no effect in the installed sisepuede version (the code that uses it is disabled).
  magnitude_removed:
    widget: note
    label: Residues removed
    tier: advanced
    help: Has no effect in the installed sisepuede version (the code that uses it is disabled).

TFR:LNDU:BOUND_CLASSES:
