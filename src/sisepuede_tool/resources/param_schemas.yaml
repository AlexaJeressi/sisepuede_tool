# ---------------------------------------------------------------- Energy

TFR:ENTC:INCREASE_EFFICIENCY_FUEL_PROD:
  dict_magnitudes:
    widget: pairs
    label: Fuel production efficiency
    help: >-
      For a produced fuel, the target output per unit of an input fuel (e.g.
      hydrogen per unit of electricity). Only the first technology that
      produces the fuel is changed. With no rows the transformation does nothing.
    keys_out:
      table: fuel
      only: [fuel_ammonia, fuel_charcoal, fuel_coal, fuel_crude, fuel_diesel, fuel_gasoline, fuel_hydrocarbon_gas_liquids, fuel_hydrogen, fuel_kerosene, fuel_natural_gas, fuel_natural_gas_liquid, fuel_natural_gas_unprocessed, fuel_oil]
    keys_in:
      table: fuel
      only: [fuel_biomass, fuel_coal, fuel_coal_deposits, fuel_crude, fuel_diesel, fuel_electricity, fuel_gasoline, fuel_hydrogen, fuel_natural_gas, fuel_natural_gas_unprocessed, fuel_oil, fuel_water]
    unit: ratio
    rows: 4
    default: null
    tier: basic
  kwargs:
    widget: note
    label: Extra options
    help: Not used by the app.

TFR:ENTC:TARGET_RENEWABLE_ELEC:
  dict_entc_renewable_target_msp:
    widget: values
    label: Minimum share of electricity by technology
    help: >-
      Optional floor on each renewable's share of generation in the final year.
      If the total is above the overall renewable target, sisepuede scales them
      down to fit it.
    keys: {table: technology, only: [pp_geothermal, pp_hydropower, pp_ocean, pp_solar, pp_wind]}
    unit: share
    sum_rule: none
    default: {}
  categories_entc_renewable:
    widget: multi
    label: Technologies counted as renewable
    help: >-
      Leave empty to use sisepuede's list (geothermal, hydropower, ocean, solar,
      wind). If you set a list, only technologies that also have a minimum share
      above are treated as renewable.
    keys: {table: technology, only: [pp_biogas, pp_biomass, pp_coal, pp_coal_ccs, pp_gas, pp_gas_ccs, pp_geothermal, pp_hydropower, pp_nuclear, pp_ocean, pp_oil, pp_solar, pp_waste_incineration, pp_wind]}
  categories_entc_max_investment_ramp:
    widget: multi
    label: Technologies with capped investment growth
    keys: {table: technology}

TFR:ENTC:TARGET_CLEAN_HYDROGEN:
  categories_source:
