      final year. Leave a cell blank for no limit. With no limits at all the
      transformation does nothing.
    keys: {table: landuse}
    unit: ha
    sum_rule: none
    default: null
    tier: basic
  delim_key:
    widget: note
    label: Key separator
    help: Set by the app.

TFR:LNDU:DEC_CLASS_LOSS:
