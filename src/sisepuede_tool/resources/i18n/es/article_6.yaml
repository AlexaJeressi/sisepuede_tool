# Article 6 page (es). Draft: review before release.

"article_6":
  "carbon_price": "Precio del carbono"
  "carbon_price_tip": "Los créditos se valoran al precio del carbono de cada año meta de la NDC2.0. Solo cuentan los años meta, por lo que solo sus precios cambian el resultado."
  "change_price": "Cambiar el precio del carbono"
  "reset": "Restablecer los precios de referencia"
  "instant": "Los recuadros, el gráfico y la descarga se actualizan de inmediato; no hace falta una nueva ejecución."
  "by_group": "Créditos (reducción de emisiones) por grupo de emisiones"
  "by_group_tip": "Para cada año meta de la NDC2.0, el valor de las emisiones que una trayectoria mantiene por debajo de la meta de cada grupo de emisiones. Un grupo por encima de su meta resta créditos: su barra queda por debajo de cero. La zona gris, después de {year}, va más allá de las metas de la NDC2.0."
  "empty_none": "Ejecute una trayectoria que vaya más allá de la NDC2.0 (p. ej., LEP) para ver sus créditos."
  "empty_zero": "Las trayectorias quedan exactamente en la meta de la NDC2.0 de cada grupo de emisiones en los años meta: no hay créditos."
  "empty_hidden": "Todos los grupos de emisiones con créditos están ocultos: haz clic en un grupo de la leyenda para mostrarlo."
  "legend_hint": "Haz clic en un grupo para ocultarlo o mostrarlo."
  "show_all": "Mostrar todos"
  "pathways_chart": "Emisiones de las trayectorias"
  "pathways_chart_tip": "Emisiones de cada trayectoria, sumadas sobre los grupos de emisiones que tienen meta en la NDC2.0 (los que cuentan para los créditos). La banda sombreada, en los años meta, es la diferencia entre la trayectoria NDC2.0 y una trayectoria que va más allá: verde donde emite menos que la NDC2.0, roja donde emite más. Las barras de créditos de abajo comparan cada grupo con su meta NDC2.0, que sisepuede_a6 construyó a partir de su propia corrida NDC2.0, así que siguen a la banda solo en la medida en que la trayectoria NDC2.0 coincide con las metas. La zona gris, después de {year}, va más allá de las metas de la NDC2.0: ahí las metas continúan la corrida NDC2.0 de sisepuede_a6."
  "above_ndc": "Por encima de la NDC2.0"
  "beyond_ndc": "Más allá de la NDC2.0"
  "after_ndc_targets": "Después de {year}: fuera de la meta de la NDC2.0"
  "reference_prices": "precios de referencia"
  "changed": "Modificado en opciones avanzadas. Precios de referencia: {prices}."
  "left_out": "Sin emisiones en estas ejecuciones: {groups}. La electricidad y las emisiones fugitivas requieren el modelo eléctrico: active “Ejecutar el despacho eléctrico (NemoMod)” en la página Ejecutar."
  "not_shown": "No se muestran: {names}. Las metas de la NDC2.0 son las emisiones de la propia trayectoria NDC2.0, así que solo las trayectorias con transformaciones más allá de la NDC2.0 generan créditos."
  "total_years": "Total {years}"
  "price_range": "{years}: {range}, promedio {avg}"
  "all_years": "Todos los años"
  "apply_all": "Aplicar a todos los años"
  "by_year": "Cambiar año por año"
  "by_transformer": "Créditos por transformación dentro de cada sector, ordenados por MAC"
  "by_transformer_tip": "Los mismos créditos de la gráfica de arriba, con cada sector dividido en sus transformaciones, ordenadas por su MAC dentro de él (la más alta en la base), cada una en un tono más claro del color del sector (más cercano a él = MAC más alto; el color del sector, en la gráfica de arriba, es el más fuerte). Una transformación que reduce en varios sectores aparece en cada uno, con su valor y su MAC ahí. Los valores son los de sisepuede_a6, tal como están en su archivo. Con Proyectos activado, la franja arriba de la gráfica muestra la transformación bajo el cursor y los proyectos vinculados a ella (página Pathways); el filtro deja solo las transformaciones elegidas. La zona gris, después de {year}, va más allá de las metas de la NDC2.0."
  "by_sector_mac": "Créditos por sector, ordenados por MAC"
  "by_sector_mac_tip": "El archivo ordenado de sisepuede_a6 (ref/temporary_a6_ranked_mac_bar_df.csv), tal cual: el valor de los créditos de cada año por sector (grupo de emisiones), con los sectores apilados por su MAC, el más alto en la base. El MAC de un sector es el de sus transformaciones en el archivo, ponderado por su parte de los créditos del sector (proportional_a6_excess_allocation). Un clic en un sector de la leyenda lo oculta o lo muestra aquí y en la gráfica de abajo. La zona gris, después de {year}, va más allá de las metas de la NDC2.0."
  "ranked_panel": "LEP"
  "ranked_missing": "No se encontró el archivo de MAC ordenado de sisepuede_a6 (ref/temporary_a6_ranked_mac_bar_df.csv)."
  "overall": "Créditos por transformación, ordenados por MAC, toda la economía"
  "overall_tip": "El archivo agregado de sisepuede_a6 (ref/temporary_a6_ranked_mac_bar_df_all_aggregate.csv), tal cual: el valor de los créditos de cada año repartido entre las transformaciones según su parte de lo que toda la economía reduce más allá de la NDC2.0, ordenadas por su MAC de toda la economía, la más barata en la base, sin subsectores. Los totales por año son los de la gráfica de arriba. La zona gris, después de {year}, va más allá de las metas de la NDC2.0."
