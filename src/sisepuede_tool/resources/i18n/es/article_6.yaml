# Article 6 page (es). Draft: review before release.

"article_6":
  "carbon_price": "Precio del carbono"
  "carbon_price_tip": "Los créditos se valoran al precio del carbono de cada año meta de la NDC. Solo cuentan los años meta, por lo que solo sus precios cambian el resultado."
  "change_price": "Cambiar el precio del carbono"
  "reset": "Restablecer precios de referencia"
  "instant": "Los recuadros, el gráfico y la descarga se actualizan de inmediato; no hace falta una nueva ejecución."
  "by_group": "Créditos por grupo de emisiones"
  "by_group_tip": "Para cada año meta de la NDC, el valor de las emisiones que una trayectoria mantiene por debajo de la meta de cada grupo de emisiones. Un grupo por encima de su meta no gana nada y no reduce los créditos de otro grupo."
  "formula": "Créditos = meta de la NDC − emisiones de la trayectoria, cuando es positivo, por el precio del carbono de ese año."
  "empty_none": "Ejecute una trayectoria que vaya más allá de la NDC (p. ej., LEP) para ver sus créditos."
  "empty_zero": "Ninguna trayectoria queda por debajo de la meta de la NDC de algún grupo de emisiones en los años meta."
  "reference_prices": "precios de referencia"
  "changed": "Modificado en opciones avanzadas. Precios de referencia: {prices}."
  "left_out": "Excluidos (sin emisiones en estas ejecuciones): {groups}. La electricidad y las emisiones fugitivas requieren el modelo eléctrico: active “Ejecutar el despacho eléctrico (NemoMod)” en la página Ejecutar."
  "not_shown": "No se muestran: {names}. Las metas de la NDC son las emisiones de la propia trayectoria NDC, así que solo las trayectorias con transformaciones más allá de la NDC generan créditos."
