  "show_all": "Mostrar todos"
  "pathways_chart": "Emisiones de las trayectorias"
  "pathways_chart_tip": "Emisiones de cada trayectoria, sumadas sobre los grupos de emisiones que tienen meta en la NDC2.0 (los que cuentan para los créditos). La banda sombreada, en los años meta, es la diferencia entre la trayectoria NDC2.0 y una trayectoria que va más allá: verde donde emite menos que la NDC2.0, roja donde emite más. Las barras de créditos de abajo comparan cada grupo con su meta NDC2.0, que sisepuede_a6 construyó a partir de su propia corrida NDC2.0, así que siguen a la banda solo en la medida en que la trayectoria NDC2.0 coincide con las metas. La zona gris, después de {year}, va más allá de las metas de la NDC2.0: ahí las metas continúan la corrida NDC2.0 de sisepuede_a6."
  "above_ndc": "Por encima de la NDC2.0"
  "beyond_ndc": "Más allá de la NDC2.0"
  "after_ndc_targets": "Después de {year}: fuera de la meta de la NDC2.0"
  "reference_prices": "precios de referencia"
  "changed": "Modificado en opciones avanzadas. Precios de referencia: {prices}."
  "left_out": "Sin emisiones en estas ejecuciones: {groups}. La electricidad y las emisiones fugitivas requieren el modelo eléctrico: active “Ejecutar el despacho eléctrico (NemoMod)” en la página Ejecutar."
  "not_shown": "No se muestran: {names}. Las metas de la NDC2.0 son las emisiones de la propia trayectoria NDC2.0, así que solo las trayectorias con transformaciones más allá de la NDC2.0 generan créditos."
  "total_years": "Total {years}"
