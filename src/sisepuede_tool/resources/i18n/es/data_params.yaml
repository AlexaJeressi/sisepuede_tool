# Parameter labels and help from resources/param_schemas.yaml (es). Reviewed against the English source, 2026-10-15.
# data.params.<transformer code>.<parameter>.{label,help}; English is param_schemas.yaml.

"data":
  "params":
    "TFR:AGRC:TARGET_RESIDUE_MANAGEMENT":
      "dict_categories_to_magnitude":
        "label": "Proporción de tierra de cultivo con labranza cero al final del periodo"
        "help": "Proporción mínima de la tierra de cada cultivo con labranza cero (agricultura de conservación). Solo estos seis cultivos tienen una variable de labranza cero; los cultivos en blanco mantienen su proporción actual."
      "include_conservation_agriculture":
        "label": "Aplicar agricultura de conservación"
        "help": "Manténgalo activado; si se desactiva, la versión instalada de sisepuede falla."
      "magnitude_burned":
        "label": "Residuos quemados"
        "help": "No tiene efecto en la versión instalada de sisepuede (el código que lo usa está desactivado)."
      "magnitude_removed":
        "label": "Residuos retirados"
        "help": "No tiene efecto en la versión instalada de sisepuede (el código que lo usa está desactivado)."
    "TFR:LNDU:BOUND_CLASSES":
      "dict_directional_categories_to_magnitude":
        "label": "Límites de superficie por clase de uso del suelo"
        "help": "Superficie mínima y/o máxima (hectáreas) de cada clase de uso del suelo en el último año. Deje una celda en blanco para no fijar límite. Sin ningún límite, la transformación no tiene efecto."
      "delim_key":
        "label": "Separador de claves"
        "help": "Lo fija la aplicación."
    "TFR:LNDU:DEC_CLASS_LOSS":
      "cat_lndu":
        "label": "Clase de uso del suelo que se protege"
    "TFR:LNDU:INC_REFORESTATION":
