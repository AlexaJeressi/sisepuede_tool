    "TFR:ENTC:INCREASE_EFFICIENCY_FUEL_PROD":
      "dict_magnitudes":
        "label": "Eficiencia de la producción de combustibles"
        "help": "Para un combustible producido, la producción objetivo por unidad de un combustible de entrada (p. ej., hidrógeno por unidad de electricidad). Solo se modifica la primera tecnología que produce el combustible. Sin filas, la transformación no tiene efecto."
      "kwargs":
        "label": "Opciones adicionales"
        "help": "La aplicación no lo usa."
    "TFR:ENTC:TARGET_RENEWABLE_ELEC":
      "dict_entc_renewable_target_msp":
        "label": "Participación mínima de cada tecnología en la generación"
        "help": "Mínimo opcional de la participación de cada renovable en la generación del último año. Si el total supera la meta renovable global, sisepuede los reduce para ajustarse a ella."
      "categories_entc_renewable":
        "label": "Tecnologías consideradas renovables"
        "help": "Déjelo vacío para usar la lista de sisepuede (geotérmica, hidroeléctrica, oceánica, solar, eólica). Si fija una lista, solo se consideran renovables las tecnologías que además tengan una participación mínima fijada arriba."
      "categories_entc_max_investment_ramp":
        "label": "Tecnologías con crecimiento de la inversión limitado"
    "TFR:ENTC:TARGET_CLEAN_HYDROGEN":
