      "dict_magnitude":
        "label": "Vías de tratamiento al final del periodo"
        "help": "Proporción de este flujo de aguas residuales tratada por cada vía en el último año. Las vías que deje en blanco se reducen en proporción. El total no puede superar 100%: si lo supera, sisepuede ignora toda la transformación."
    "TFR:WALI:INC_TREATMENT_RURAL":
