      "dict_lsmm_pathways":
        "label": "Sistemas de manejo de estiércol al final del periodo"
        "help": "Proporción del estiércol de los animales seleccionados que maneja cada sistema en el último año. Los sistemas que deje en blanco pierden participación en proporción. El total no puede superar 100%: si lo supera, sisepuede ignora toda la transformación."
      "vec_cats_lvst":
        "label": "Animales"
