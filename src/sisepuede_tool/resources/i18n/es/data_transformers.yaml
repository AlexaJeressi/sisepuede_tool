# Transformer text from resources/transformer_catalog.yaml (es). Reviewed against the English source, 2026-10-15.
# English is the catalog itself (curated value, else computed); see README.md.

"data":
  "transformers":
    "TFR:AGRC:DEC_CH4_RICE":
      "name": "AGRC: Mejorar el manejo del cultivo de arroz"
      "description": "Reducir en 45% las emisiones de CH₄ de la producción de arroz gracias a un mejor manejo y a una menor inundación."
      "units_description": "Reducción proporcional del metano emitido por la producción de arroz"
    "TFR:AGRC:DEC_EXPORTS":
      "name": "AGRC: Reducir las exportaciones"
      "description": "Reducir en 50% las exportaciones agrícolas (respecto del periodo final)"
      "units_description": "Reducción proporcional de las exportaciones agrícolas"
    "TFR:AGRC:DEC_LOSSES_SUPPLY_CHAIN":
      "name": "AGRC: Reducir las pérdidas en la cadena de suministro"
      "description": "Reducir el desperdicio de alimentos en la cadena de suministro agrícola (cultivos), antes del consumidor"
      "units_description": "Reducción proporcional del desperdicio de alimentos en la cadena de suministro"
    "TFR:AGRC:INC_PRODUCTIVITY":
      "name": "AGRC: Mejorar la productividad de los cultivos"
      "description": "Aumentar en 20% los factores de rendimiento de los cultivos"
      "units_description": "Aumento proporcional de la productividad de los cultivos (masa/superficie)"
    "TFR:AGRC:TARGET_RESIDUE_MANAGEMENT":
      "name": "AGRC: Metas de manejo de residuos de cultivos"
      "description": "Fijar, como fracción, metas de retiro de residuos para los cultivos correspondientes. Los residuos pueden usarse como fuente de energía (y sustituir la demanda de leña en ENTC), como alimento para el ganado (enviado al LDE), quemarse o dejarse en el campo (lo que puede contribuir a la agricultura de conservación)."
      "units_description": "Fracción de residuos destinada a cada vía; puede especificarse por cultivo. También puede activarse la agricultura de conservación, que exige dejar en el campo al menos 30% de los residuos."
    "TFR:CCSQ:INC_CAPTURE":
      "name": "CCSQ: Aumentar la captura directa de aire"
      "description": "Aumentar el despliegue de captura directa de aire hasta 50 Mt CO₂e para el periodo final."
      "units_description": "Especificación exógena de la capacidad instalada de las instalaciones de captura directa de aire, en las unidades de la variable."
    "TFR:ENFU:ADJ_EXPORTS":
      "name": "ENFU: Ajustar las exportaciones"
      "description": "Aumentar o reducir las exportaciones de combustibles"
      "units_description": "Aumento (+) o reducción (-) proporcional de las exportaciones respecto del periodo final."
    "TFR:ENFU:ADJ_PRICES":
      "name": "ENFU: Ajustar los precios"
      "description": "Aumentar o reducir los precios de los combustibles"
      "units_description": "Aumento (+) o reducción (-) proporcional de los precios respecto del periodo final."
    "TFR:ENTC:DEC_LOSSES":
      "name": "ENTC: Reducir las pérdidas de transmisión"
      "description": "Reducir las pérdidas de transmisión modernizando la infraestructura de transmisión eléctrica."
      "units_description": "Fracción máxima objetivo de la electricidad transmitida que se pierde por una infraestructura eléctrica ineficiente o insuficiente."
    "TFR:ENTC:INCREASE_EFFICIENCY_FUEL_PROD":
      "name": "ENTC: Aumentar la eficiencia de la producción de combustibles"
      "description": "Reducir la razón de actividad de insumos en la producción de combustibles. Solo se aplica a tecnologías que producen un único combustible. Para la refinación de petróleo, ver XXXX."
      "units_description": "Especifique un nivel de eficiencia objetivo. Por ejemplo, en la producción de carbón vegetal el valor predeterminado es 10%, que representa una razón de actividad de insumos de 10 (10:1): se pierde 90% de la biomasa de entrada. Una meta de 40% indicaría una razón de 2.5:1: se pierde 60% de la biomasa, pero se necesita 4 veces menos biomasa para producir la misma cantidad de carbón vegetal. Esta transformación puede representar mejoras en hornos de carbón vegetal, producción de gas natural, producción de hidrógeno, producción de amoníaco, etc."
    "TFR:ENTC:LEAST_COST_SOLUTION":
      "name": "ENTC: Solución de mínimo costo"
      "description": "Calcular solo la solución de mínimo costo para la producción de electricidad y combustibles; elimina cualquier restricción sobre las participaciones de producción esperadas."
      "units_description": "Aplicar la solución NEMO de mínimo costo sin metas de energía renovable."
    "TFR:ENTC:TARGET_CLEAN_HYDROGEN":
      "name": "ENTC: Hidrógeno limpio"
      "description": "Fijar una meta de producción de hidrógeno limpio."
      "units_description": "Fracción del hidrógeno que proviene de la electrólisis."
    "TFR:ENTC:TARGET_RENEWABLE_ELEC":
      "name": "Meta de electricidad renovable"
      "description": "Fijar una meta de electricidad renovable. Incluye metas mínimas para tecnologías renovables específicas."
      "units_description": "Aplicar una meta de participación de la producción renovable (las tecnologías renovables se especifican en el archivo de entrada). Además, pueden fijarse participaciones mínimas por tecnología."
    "TFR:FGTV:DEC_LEAKS":
      "name": "Reducir las fugas"
      "description": "Reducir las fugas que generan emisiones fugitivas en la distribución, transmisión y transporte de combustibles. La reducción predeterminada es 80%."
      "units_description": "Reducción proporcional de las fugas de CO₂, CH₄ y N₂O (emisiones fugitivas)."
    "TFR:FGTV:INC_FLARE":
      "name": "Aumentar la quema en antorcha"
      "description": "Pasar del venteo a la quema en antorcha para convertir las emisiones de metano en CO₂; la magnitud predeterminada es 80%."
      "units_description": "Fracción del gas que de otro modo se ventearía y que se quema en antorcha."
    "TFR:FRST:INCREASE_SEQUESTRATION":
      "name": "FRST: Aumentar el secuestro de carbono"
      "description": "Aumentar el secuestro anual de carbono en los bosques"
      "units_description": "Aumento proporcional del secuestro. Pueden usarse números negativos para reducirlo."
    "TFR:FRST:TARGET_REMOVALS_DW":
      "name": "FRST: Aumentar la extracción de madera muerta"
      "description": "Fijar la fracción objetivo de la madera muerta generada que se extrae para satisfacer la demanda de extracción. Esto puede afectar la biodiversidad, la salud de los bosques y las reservas de carbono del suelo."
      "units_description": "Fracción objetivo de madera muerta extraída. Debe estar entre 0 y 1."
    "TFR:GNRL:INC_DENSITY_URBAN":
      "name": "GNRL: Aumentar la densidad urbana"
      "description": "Aumentar la densidad de población urbana, lo que afecta a los asentamientos y a la superficie de tierra necesaria para zonas urbanizadas."
      "units_description": "Aumento proporcional de la densidad de población; p. ej., ingrese 20% para aumentar la densidad en 20%. Los números negativos indican una menor densidad de las zonas urbanas."
    "TFR:INEN:INC_EFFICIENCY_ENERGY":
      "name": "Aumentar la eficiencia energética industrial"
      "description": "Aumentar la eficiencia energética de los procesos de producción industrial. El valor predeterminado es 30%."
      "units_description": "Mejora proporcional de la eficiencia media de la tecnología industrial."
    "TFR:INEN:INC_EFFICIENCY_PRODUCTION":
      "name": "Aumentar la eficiencia de la producción industrial"
      "description": "Aumentar la eficiencia de los procesos de producción industrial (más producción por unidad de demanda). El valor predeterminado es 40%."
      "units_description": "Mejora proporcional de la eficiencia de producción (p. ej., kJ/tonelada)."
    "TFR:INEN:SHIFT_FUEL_HEAT":
      "name": "INEN: Cambio de combustible en procesos térmicos de alta y baja temperatura"
      "description": "Las transformaciones de calor de baja y/o alta temperatura deben implementarse con este transformador."
      "units_description": "Esta transformación puede especificarse para cambiar 90% del calor de baja temperatura (a electricidad) y de alta temperatura (según la industria, a electricidad e hidrógeno)."
    "TFR:IPPU:DEC_CLINKER":
      "name": "IPPU: Reducir el clínker del cemento"
      "description": "Reducir el uso de clínker en la producción de cemento"
      "units_description": "Reducción proporcional del uso de clínker en la producción de cemento."
    "TFR:IPPU:DEC_DEMAND":
      "name": "IPPU: Gestión de la demanda"
      "description": "Reducir la demanda de producción de la industria. Si se aplica, el valor predeterminado es 30%."
      "units_description": "Reducción proporcional de la demanda de producción. NOTA: este transformador no se usa con frecuencia."
    "TFR:IPPU:DEC_HFCS":
      "name": "IPPU: Reducir el uso de HFC"
      "description": "Reducir las emisiones de HFC en los procesos industriales mediante cambio tecnológico, control de fugas y abandono de su uso. El valor predeterminado es 10%."
      "units_description": "Reducción proporcional de los factores de emisión de HFC por cantidad producida."
    "TFR:IPPU:DEC_N2O":
      "name": "IPPU: Reducir las emisiones de óxido nitroso"
      "description": "Reducir las emisiones de N₂O en los procesos industriales mediante cambio tecnológico, control de fugas y abandono de su uso. El valor predeterminado es 10%."
      "units_description": "Reducción proporcional de los factores de emisión de N₂O por cantidad producida."
    "TFR:IPPU:DEC_OTHER_FCS":
      "name": "IPPU: Reducir otros compuestos fluorados"
      "description": "Incluye SF₆, NF₃, HCFC y otros"
      "units_description": "Reducción proporcional de los factores de emisión de otros compuestos fluorados por cantidad producida."
    "TFR:IPPU:DEC_PFCS":
      "name": "IPPU: Reducir el uso de PFC"
      "description": "Reducir las emisiones de PFC en los procesos industriales mediante cambio tecnológico, control de fugas y abandono de su uso. El valor predeterminado es 10%."
      "units_description": "Reducción proporcional de los factores de emisión de PFC por cantidad producida."
    "TFR:LNDU:BOUND_CLASSES":
      "name": "LNDU: Acotar clases de uso del suelo"
      "description": "Las clases de uso del suelo se estiman con una matriz de transición y se ajustan con un programa cuadrático. Esta transformación permite fijar límites superiores e inferiores a las clases de uso del suelo que pueden cambiar. Puede representar la creación de áreas protegidas mediante un límite mínimo, o impedir crecimiento adicional mediante el límite máximo."
      "units_description": "Superficies de tierra por clase que se acotan (en las unidades de las variables «Maximum Area» y «Minimum Area»)"
    "TFR:LNDU:DEC_CLASS_LOSS":
      "name": "LNDU: Reducir la pérdida de clases de uso del suelo"
      "description": "Detener la pérdida de una clase de uso del suelo específica; al igual que DEC_DEFORESTATION, aumenta la probabilidad de que una clase permanezca como tal. Sin embargo, el transformador DEC_DEFORESTATION impide que varias clases cambien a otras."
      "units_description": "Probabilidad de transición objetivo de que una clase de uso del suelo permanezca en esa clase (más cerca de 1 significa menos pérdida)"
    "TFR:LNDU:DEC_DEFORESTATION":
      "name": "Reducir la deforestación"
      "description": "Detener la deforestación de bosques primarios y secundarios"
      "units_description": "Probabilidad de transición objetivo de que las clases de bosque permanezcan en esa clase (más cerca de 1 significa menos pérdida)"
    "TFR:LNDU:DEC_SOC_LOSS_PASTURES":
      "name": "LNDU: Ampliar las prácticas de pastoreo sostenible"
      "description": "Reducir la pérdida de carbono orgánico del suelo en pastizales mediante prácticas de pastoreo sostenible.\nPastizales: aumentar F_MG de «grasslands» a 1.157 (ver IPCC V4, capítulo 6, cuadro 6.2 [2019R], factores de manejo de pastizales F_MG bajo distintos regímenes de manejo; media de «Improved Grassland»)"
      "units_description": "Fracción de los pastizales con pastoreo sostenible"
    "TFR:LNDU:INC_PRODUCTIVITY_PASTURES":
      "name": "LNDU: Aumentar la productividad de los pastizales"
      "description": "Aumenta el rendimiento medio de materia seca en los pastizales. Está limitado por el rendimiento máximo factible de los pastizales (definido en «Maximum Pasture Dry Matter Yield Factor»), que suele depender del nivel de riego y del clima."
      "units_description": "Aumento proporcional objetivo del rendimiento medio de materia seca."
    "TFR:LNDU:INC_REFORESTATION":
      "name": "LNDU: Aumentar la reforestación"
      "description": "Aumenta la probabilidad de que las clases de uso del suelo de origen se conviertan en bosques secundarios. Esta transformación puede definirse para clases de uso del suelo específicas; p. ej., convertir solo matorrales y tierras de cultivo en"
      "units_description": "Aumento proporcional objetivo de la superficie forestal"
    "TFR:LNDU:INC_SILVOPASTURE":
      "name": "LNDU: Ampliar los sistemas silvopastoriles"
      "description": "Aumentar el uso de sistemas silvopastoriles incrementando el factor medio de secuestro asociado a los pastizales. Este transformador modela los sistemas silvopastoriles como una fracción de pastizales con plantaciones forestales. Como la magnitud es una fracción de superficie, el factor medio de secuestro se estima como m*f, donde m es la magnitud (prevalencia) y f es el factor de secuestro del bosque secundario."
      "units_description": "Fracción de los pastizales con sistemas silvopastoriles. Aplica a esa superficie los factores de secuestro de carbono del bosque secundario."
    "TFR:LNDU:PLUR":
      "name": "LNDU: Reasignación parcial del uso del suelo"
      "description": "Fijar el factor de reasignación del uso del suelo en 0.5"
      "units_description": "El factor de reasignación, entre 0 y 1, representa la sensibilidad del uso del suelo a la demanda agropecuaria externa (cultivos y ganado). Un valor de 1 es totalmente sensible (pleno poder de mercado) y un valor de 0 no responde en absoluto (p. ej., uso del suelo con planificación centralizada)."
    "TFR:LSMM:INC_CAPTURE_BIOGAS":
      "name": "LSMM: Aumentar la captura de biogás en instalaciones de descomposición anaeróbica"
      "description": "Aumentar la fracción de biogás que se captura del estiércol tratado en instalaciones anaeróbicas de tratamiento de estiércol del ganado"
      "units_description": "Fracción mínima objetivo del biogás capturado en instalaciones de manejo de estiércol con descomposición anaeróbica (incluidas las lagunas)"
    "TFR:LSMM:INC_MANAGEMENT_CATTLE_PIGS":
      "name": "LSMM: Mejorar el manejo del estiércol de bovinos y porcinos"
      "description": "Se trata el 95% del estiércol de bovinos (lecheros y no lecheros) y porcinos. En condiciones predeterminadas, el estiércol tratado se destina a:\n37.5% digestión anaeróbica\n12.5% compostaje\n25.0% distribución diaria\n12.5% cama profunda\n12.5% almacenamiento de sólidos"
      "units_description": "Fracciones del estiércol de bovinos y porcinos que se manejan en cada sistema de manejo (LSMM). Puede especificarse cualquier sistema de destino."
    "TFR:LSMM:INC_MANAGEMENT_OTHER":
      "name": "LSMM: Mejorar el manejo del estiércol de otros animales"
      "description": "Se trata el 95% del estiércol de todos los demás animales. El estiércol tratado se destina a:\n37.5% compostaje\n12.5% parcela seca\n25.0% distribución diaria\n25.0% almacenamiento de sólidos"
      "units_description": "Fracciones del estiércol de animales distintos de bovinos, porcinos y aves que se manejan en cada sistema de manejo (LSMM). Puede especificarse cualquier sistema de destino."
    "TFR:LSMM:INC_MANAGEMENT_POULTRY":
      "name": "LSMM: Mejorar el manejo del estiércol de aves"
      "description": "Se trata el 95% del estiércol de aves (pollos) y porcinos. El estiércol tratado se destina a:\n100% manejo de estiércol avícola"
      "units_description": "Fracciones del estiércol avícola que se manejan en cada sistema de manejo (LSMM). Puede especificarse cualquier sistema de destino."
    "TFR:LVST:DEC_ENTERIC_FERMENTATION":
      "name": "LVST: Reducir la fermentación entérica"
      "description": "Reducir la fermentación entérica mediante aditivos para piensos, vacunas contra metanógenos y otros procesos y adaptaciones tecnológicas.\nNOTA: no incluye el cambio de alimentación, que se trata en la transformación de cambio de dieta."
      "units_description": "Reducción proporcional de la fermentación entérica en todas las clases"
    "TFR:LVST:DEC_EXPORTS":
      "name": "LVST: Reducir las exportaciones"
      "description": "Reducir en 50% las exportaciones de ganado y productos pecuarios (respecto del periodo final)"
      "units_description": "Reducción proporcional de las exportaciones pecuarias"
    "TFR:LVST:INC_PRODUCTIVITY":
      "name": "LVST: Aumentar la productividad ganadera"
      "description": "Aumentar en 20% la capacidad de carga ganadera inferida"
      "units_description": "Aumento proporcional de la productividad ganadera"
    "TFR:LVST:SHIFT_DIETARY_BOUNDS":
      "name": "LVST: Cambiar la dieta del ganado"
      "description": "Ajustar los límites de la dieta del ganado a los niveles mínimos y máximos deseados. Hay cuatro opciones de alimentación: cultivos de cereales, cultivos no cereales, residuos de cultivos y pastizales. La mezcla de cultivos disponible como alimento se define por la fracción de cada cultivo destinada a forraje. Los cambios de dieta afectan la demanda de uso del suelo, la fermentación entérica y el N del estiércol."
      "units_description": "Para cada tipo de ganado pueden fijarse fracciones máximas y/o mínimas por tipo de alimento. Para una clase de ganado, la suma de las fracciones mínimas no puede superar 1 y la de las máximas no puede ser menor que 1. Las fracciones de la dieta se resuelven con el estimador de dieta del ganado (LDE)."
    "TFR:PFLO:INC_HEALTHIER_DIETS":
      "name": "PFLO: Cambiar las dietas"
      "description": "Incluye una reducción de la demanda de carne roja y permite cambiar la demanda de distintos cultivos."
      "units_description": "Fracción máxima objetivo de la demanda per cápita de carne roja (bovina)."
    "TFR:PFLO:INC_IND_CCS":
      "name": "PFLO: Captura y almacenamiento de carbono en la industria"
      "description": "Aplica captura de carbono en instalaciones industriales, lo que afecta las emisiones de INEN e IPPU. Especifique una fracción mínima objetivo de instalaciones industriales con captura de carbono (prevalencia) y la eficacia objetivo de la captura en esas instalaciones."
      "units_description": "Fracción mínima objetivo de instalaciones industriales con captura de carbono (prevalencia) y eficacia objetivo de la captura en esas instalaciones."
    "TFR:SCOE:DEC_DEMAND_HEAT":
      "name": "SCOE: Reducir la demanda final de calor mejorando la envolvente de los edificios"
      "description": "Reducir la demanda de energía térmica (cocción y calefacción) en edificios residenciales y comerciales mediante aislamiento y mejoras en los edificios. El valor predeterminado es 50%."
      "units_description": "Cambio proporcional de la demanda de calor en los edificios."
    "TFR:SCOE:INC_EFFICIENCY_APPLIANCE":
      "name": "SCOE: Aumentar la eficiencia de los electrodomésticos"
      "description": "Aumentar la eficiencia de los aparatos eléctricos en edificios residenciales y comerciales mediante avances tecnológicos (p. ej., programas y normas de eficiencia). El valor predeterminado es 50%."
      "units_description": "Aumento proporcional de la eficiencia de los aparatos eléctricos en edificios (residenciales y comerciales/municipales)."
    "TFR:SCOE:INC_EFFICIENCY_HEAT":
      "name": "SCOE: Aumentar la eficiencia térmica"
      "description": "Aumentar la eficiencia de las tecnologías de calor en edificios residenciales y comerciales mediante avances tecnológicos (p. ej., programas y normas de eficiencia). El valor predeterminado es 20%."
      "units_description": "Aumento proporcional de la eficiencia de las tecnologías de suministro de calor en edificios (residenciales y comerciales/municipales). Las eficiencias no eléctricas tienen un tope de 1."
    "TFR:SCOE:SHIFT_FUEL_HEAT":
      "name": "SCOE: Electrificar el calor con bombas de calor, cocinas eléctricas, etc."
      "description": "Cambiar la energía para calefacción y cocción a otros combustibles mediante cambio tecnológico. Por defecto, 95% pasa a electricidad."
      "units_description": "Fracción de la energía térmica que pasa a electricidad."
    "TFR:SOIL:DEC_LIME_APPLIED":
      "name": "SOIL: Mejorar la aplicación de cal"
      "description": "Reducir la cal aplicada a los suelos (5% por defecto)"
      "units_description": "Reducción proporcional de la cal aplicada a los suelos"
    "TFR:SOIL:DEC_N_APPLIED":
      "name": "SOIL: Mejorar la aplicación de fertilizantes"
      "description": "Reducir el nitrógeno total aplicado mediante un uso más preciso de fertilizantes (5% por defecto)"
      "units_description": "Reducción proporcional del N de fertilizantes aplicado a los suelos"
    "TFR:TRDE:DEC_DEMAND":
      "name": "TRDE: Reducir la demanda de transporte"
      "description": "Reducir la demanda de transporte mediante mejor planificación e infraestructura. El valor predeterminado es 25%."
      "units_description": "Reducción proporcional de la demanda agregada de transporte por tipo de demanda de TRDE (p. ej., public_private, regional o freight)"
    "TFR:TRNS:INC_EFFICIENCY_ELECTRIC":
      "name": "TRNS: Aumentar la eficiencia energética del transporte eléctrico"
      "description": "Aumentar la eficiencia de los vehículos eléctricos (p. ej., reducir kWh/km). El valor predeterminado es 25%."
      "units_description": "Aumento proporcional de la eficiencia de los vehículos eléctricos respecto del periodo final."
    "TFR:TRNS:INC_EFFICIENCY_NON_ELECTRIC":
      "name": "TRNS: Aumentar la eficiencia energética del transporte no eléctrico"
      "description": "Aumentar la eficiencia de los vehículos no eléctricos (p. ej., aumentar km/l). El valor predeterminado es 25%."
      "units_description": "Aumento proporcional de la eficiencia de los vehículos no eléctricos respecto del periodo final"
    "TFR:TRNS:INC_OCCUPANCY_LIGHT_DUTY":
      "name": "TRNS: Aumentar la ocupación de los vehículos privados"
      "description": "Aumentar la ocupación de los vehículos ligeros; p. ej., mediante el uso compartido del automóvil. El valor predeterminado es 25%."
      "units_description": "Aumento proporcional de la tasa media de ocupación de los vehículos privados."
    "TFR:TRNS:SHIFT_FUEL_LIGHT_DUTY":
      "name": "TRNS: Electrificar el transporte ligero por carretera"
      "description": "Cambiar los combustibles de los vehículos ligeros a fuentes menos intensivas en carbono. Por defecto se cambia 70% a electricidad."
      "units_description": "Fracción mínima objetivo de vehículos ligeros que usan electricidad. Puede usarse para explorar otros cambios de combustible mediante un diccionario."
    "TFR:TRNS:SHIFT_FUEL_MARITIME":
      "name": "TRNS: Cambio de combustible en el transporte marítimo"
      "description": "Cambiar los combustibles marítimos (embarcaciones y buques) a fuentes menos intensivas en carbono. Por defecto se cambia 70% a hidrógeno."
      "units_description": "Fracción mínima objetivo del transporte marítimo que usa hidrógeno. Puede usarse para explorar otros combustibles, como el amoníaco, mediante un diccionario."
    "TFR:TRNS:SHIFT_FUEL_MEDIUM_DUTY":
      "name": "TRNS: Cambio de combustible en el transporte mediano por carretera"
      "description": "Cambiar los combustibles de los vehículos medianos a fuentes menos intensivas en carbono. Por defecto se cambia 70% a electricidad."
      "units_description": "Fracción mínima objetivo del transporte mediano por carretera que usa electricidad. Puede usarse para explorar otros cambios de combustible mediante un diccionario."
    "TFR:TRNS:SHIFT_FUEL_RAIL":
      "name": "TRNS: Electrificar el ferrocarril"
      "description": "Cambiar los combustibles del ferrocarril (carga y pasajeros) a fuentes menos intensivas en carbono. Por defecto se cambia 25% a electricidad."
      "units_description": "Fracción mínima objetivo del ferrocarril que usa electricidad. Puede usarse para explorar otros cambios de combustible mediante un diccionario."
    "TFR:TRNS:SHIFT_MODE_FREIGHT":
      "name": "TRNS: Cambio modal del transporte de carga"
      "description": "Trasladar un porcentaje de la demanda de carga a otros modos. Por defecto se traslada 20% de la aviación y la carretera al ferrocarril."
      "units_description": "Especifique una reducción proporcional del factor medio de corrección de metano en los rellenos sanitarios. Puede representar el paso a rellenos semiaeróbicos. Los valores negativos _aumentan_ el MCF, lo que representa el paso a rellenos anaeróbicos."
      "magnitude_help": "Proporción de la carga que deja los modos seleccionados (por defecto aviación y carretera pesada) al final del periodo."
    "TFR:TRNS:SHIFT_MODE_PASSENGER":
      "name": "TRNS: Cambio modal de pasajeros desde vehículos ligeros"
      "description": "Trasladar un porcentaje de la demanda cotidiana de pasajeros a otros modos. Por defecto se traslada 30% de los autos ligeros a la movilidad eléctrica, la caminata y la bicicleta, y el transporte público."
      "units_description": "Fracción de la demanda de pasajeros que pasa de los pasajeros-km en vehículos ligeros por carretera a otras formas (por defecto, movilidad activa y ligera). Pueden explorarse cambios modales adicionales mediante un diccionario."
    "TFR:TRNS:SHIFT_MODE_REGIONAL":
      "name": "TRNS: Cambio modal de los viajes regionales de pasajeros"
      "description": "Trasladar un porcentaje de la demanda regional de pasajeros a otros modos. Por defecto se traslada 10% de la aviación y 20% de la demanda regional en vehículos ligeros al ferrocarril de pasajeros."
      "units_description": "Fracción de la demanda regional de pasajeros que pasa de los pasajeros-km en vehículos ligeros por carretera y en aviación al transporte pesado por carretera."
    "TFR:TRWW:INC_CAPTURE_BIOGAS":
      "name": "TRWW: Aumentar la captura de biogás"
      "description": "Capturar biogás en las plantas de tratamiento de aguas residuales. El nivel de captura predeterminado es 85%."
      "units_description": "Fracción mínima objetivo de plantas anaeróbicas de tratamiento de aguas residuales con captura de biogás."
    "TFR:TRWW:INC_COMPLIANCE_SEPTIC":
      "name": "TRWW: Aumentar el cumplimiento de las fosas sépticas"
      "description": "Aumentar el cumplimiento normativo de las fosas sépticas en uso; el cumplimiento reduce las emisiones por fugas, desbordes y aguas residuales estancadas."
      "units_description": "Fracción mínima objetivo de fosas sépticas con pleno cumplimiento."
    "TFR:WALI:INC_TREATMENT_INDUSTRIAL":
      "name": "WALI: Mejorar el tratamiento de aguas residuales industriales"
      "description": "Aumentar el tratamiento de las aguas residuales industriales. Por defecto se envía 80% de las aguas residuales industriales a tratamiento terciario anaeróbico, 10% a secundario aeróbico y 10% a secundario anaeróbico."
      "units_description": "Distribución mínima objetivo entre las vías de tratamiento de aguas residuales en instalaciones industriales. Puede especificarse cualquier vía."
    "TFR:WALI:INC_TREATMENT_RURAL":
      "name": "WALI: Mejorar el tratamiento de aguas residuales rurales"
      "description": "Aumentar el tratamiento de las aguas residuales rurales. Por defecto se envía 100% de las aguas residuales rurales a fosas sépticas."
      "units_description": "Distribución mínima objetivo entre las vías de tratamiento de aguas residuales en zonas rurales. Puede especificarse cualquier vía."
    "TFR:WALI:INC_TREATMENT_URBAN":
      "name": "WALI: Mejorar el tratamiento de aguas residuales urbanas"
      "description": "Aumentar el tratamiento de las aguas residuales urbanas. Por defecto se envía 30% de las aguas residuales a tratamiento terciario anaeróbico, 30% a terciario aeróbico, 20% a secundario aeróbico y 20% a secundario anaeróbico."
      "units_description": "Distribución mínima objetivo entre las vías de tratamiento de aguas residuales en zonas urbanas. Puede especificarse cualquier vía."
    "TFR:WASO:DEC_CONSUMER_FOOD_WASTE":
      "name": "WASO: Reducir el desperdicio de alimentos de los consumidores"
      "description": "Reducir la cantidad de desperdicio de alimentos generado per cápita"
      "units_description": "Reducción proporcional del desperdicio de alimentos per cápita respecto del periodo final"
    "TFR:WASO:DEC_MCF_LANDFILLS":
      "name": "WASO: Reducir el factor medio de corrección de metano de los rellenos sanitarios"
      "description": "Especifique una reducción proporcional del factor medio de corrección de metano en los rellenos sanitarios. Puede representar el paso a rellenos semiaeróbicos. Los valores negativos _aumentan_ el MCF, lo que representa el paso a rellenos anaeróbicos."
      "units_description": "Especifique una reducción proporcional del factor medio de corrección de metano en los rellenos sanitarios. Puede representar el paso a rellenos semiaeróbicos. Los valores negativos _aumentan_ el MCF, lo que representa el paso a rellenos anaeróbicos."
    "TFR:WASO:INC_ANAEROBIC_AND_COMPOST":
      "name": "WASO: Aumentar el compostaje y el biogás"
      "description": "Aumentar la fracción de residuos de jardín, alimentos y lodos tratados en biodigestores anaeróbicos o mediante compostaje"
      "units_description": "Metas, como fracción, de residuos orgánicos tratados mediante compostaje y biodigestores anaeróbicos. Pueden especificarse fracciones distintas."
    "TFR:WASO:INC_CAPTURE_BIOGAS":
      "name": "WASO: Aumentar la captura de biogás"
      "description": "Aumentar la fracción de biogás capturado en rellenos sanitarios y biodigestores anaeróbicos"
      "units_description": "Fracción mínima objetivo de instalaciones anaeróbicas de disposición de residuos sólidos (rellenos y biodigestores) con captura de biogás."
    "TFR:WASO:INC_ENERGY_FROM_BIOGAS":
      "name": "WASO: Biogás para producir energía"
      "description": "Aumentar la fracción del biogás recolectado que se usa para energía"
      "units_description": "Fracción mínima objetivo del biogás capturado que se usa para producir energía."
    "TFR:WASO:INC_ENERGY_FROM_INCINERATION":
      "name": "WASO: Incineración para producir energía"
      "description": "Aumenta la fracción de los residuos incinerados que se aprovecha para energía. La fracción predeterminada es 85%."
      "units_description": "Fracción mínima objetivo de residuos incinerados con aprovechamiento energético."
    "TFR:WASO:INC_LANDFILLING":
      "name": "WASO: Aumentar la disposición en rellenos sanitarios"
      "description": "Aumentar la fracción de residuos que de otro modo no se tratan (es decir, después del reciclaje, el compostaje, etc.) que se envía a rellenos sanitarios"
      "units_description": "Fracción objetivo de los residuos que no se reciclan de otro modo (incluido el compostaje de orgánicos) que se envía a rellenos sanitarios."
    "TFR:WASO:INC_RECYCLING":
      "name": "WASO: Aumentar el reciclaje"
      "description": "Aumenta la cantidad de residuos reciclables que se reciclan; los residuos de alimentos y de jardín se incluyen en esta transformación y se envían a compostaje. El valor predeterminado es 95%."
      "units_description": "Fracción objetivo de residuos que se reciclan (los residuos orgánicos y de jardín se compostan)."
