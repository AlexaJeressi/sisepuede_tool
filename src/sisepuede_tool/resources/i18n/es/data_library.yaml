# NDC/LEP library transformations from resources/library/egypt_ndc and egypt_lep (es). Draft: review before release.
# data.library.<transformation code>.{name,description}; names keep the "NDC · " / "LEP · " set prefix.

data:
  library:
    "TX:AGRC:DEC_CH4_RICE_STRATEGY_NDC":
      name: "NDC · AGRC: Mejorar el manejo del arroz"
      description: "Estrategia NDC de Egipto (6003 PFLO:NDC), ssp_egypt btr_invent.\nReducir en 45% las emisiones de CH₄ de la producción de arroz gracias a un mejor manejo y a una menor inundación."
    "TX:AGRC:DEC_LOSSES_SUPPLY_CHAIN_STRATEGY_NDC":
