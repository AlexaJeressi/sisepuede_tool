      description: "Estrategia NDC de Egipto (6003 PFLO:NDC), ssp_egypt btr_invent.\nReducir las pérdidas de transmisión modernizando la infraestructura de transmisión eléctrica."
    "TX:ENTC:TARGET_CLEAN_HYDROGEN_STRATEGY_NDC":
