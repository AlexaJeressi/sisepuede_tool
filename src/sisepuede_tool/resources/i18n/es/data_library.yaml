      description: "Estrategia NDC de Egipto (6003 PFLO:NDC), ssp_egypt btr_invent.\nReducir el desperdicio de alimentos en la cadena de suministro agrícola (cultivos), antes del consumidor"
    "TX:ENTC:DEC_LOSSES_STRATEGY_NDC":
