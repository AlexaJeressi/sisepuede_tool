    "TX:LNDU:DEC_SOC_LOSS_PASTURES_STRATEGY_NDC":
      name: "NDC · LNDU: Ampliar las prácticas de pastoreo sostenible"
      description: "Estrategia NDC de Egipto (6003 PFLO:NDC), ssp_egypt btr_invent.\nReducir la pérdida de carbono orgánico del suelo en pastizales mediante prácticas de pastoreo sostenible.\nPastizales: aumentar F_MG de «grasslands» a 1.157 (ver IPCC V4, capítulo 6, cuadro 6.2 [2019R], factores de manejo de pastizales F_MG bajo distintos regímenes de manejo; media de «Improved Grassland»)"
    "TX:LNDU:INC_REFORESTATION_STRATEGY_NDC":
      name: "NDC · LNDU: Aumentar la reforestación"
      description: "Estrategia NDC de Egipto (6003 PFLO:NDC), ssp_egypt btr_invent.\nAumenta la probabilidad de que las clases de uso del suelo de origen se conviertan en bosques secundarios. Esta transformación puede definirse para clases de uso del suelo específicas; p. ej., convertir solo matorrales y tierras de cultivo en"
    "TX:LSMM:INC_CAPTURE_BIOGAS_STRATEGY_NDC":
