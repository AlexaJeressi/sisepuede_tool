    "TX:ENTC:TARGET_RENEWABLE_ELEC_STRATEGY_NDC":
      name: "NDC · ENTC: Meta de electricidad renovable"
      description: "Estrategia NDC de Egipto (6003 PFLO:NDC), ssp_egypt btr_invent. Mezcla renovable actualizada por jcsyme en el commit 802be90 (2026-10-06), usada para las metas de demostración del Artículo 6.\nFijar una meta de electricidad renovable. Incluye metas mínimas para tecnologías renovables específicas."
    "TX:FGTV:DEC_LEAKS_STRATEGY_NDC":
