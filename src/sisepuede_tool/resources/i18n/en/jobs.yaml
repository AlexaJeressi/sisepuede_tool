# Jobs page (ui/page_jobs.py).

"jobs":
  "intro": "Jobs demanded by the investments of the NDC2.0 and LEP pathways, estimated with an input-output model (EORA26), and how the LEP changes Egypt's baseline jobs. The numbers are the ones of the Egypt briefing (resources/jobs/data); scripts/build_jobs_data.py rebuilds them from new runs."
  "multiplier": "Jobs per million USD invested"
  "multiplier_tip": "Jobs (direct and indirect) demanded in each economic sector per million USD invested in each SSP sector, from the input-output model: the jobs of the sector's transformations, added up. The colour saturates at 10."
  "demand": "Jobs demanded by the investments"
  "demand_tip": "Jobs demanded each year by the pathway's investments (technical costs), by economic sector: jobs per million USD of each SSP sector times what the pathway invests in it that year."
  "energy": "Energy and non-energy investments"
  "energy_tip": "The same jobs, split by the investments they come from: energy (buildings, CCS, fugitive emissions, industrial energy, power and transport) and non-energy (the other SSP sectors)."
  "by_ssp": "Jobs by investing sector"
  "by_ssp_tip": "The same jobs, by the SSP sector whose investments demand them."
  "baseline": "Baseline jobs"
  "baseline_tip": "Egypt's jobs without the LTS: working-age population (UN WPP 2024) times labour force participation (45% to 48%) times employment (unemployment 9.9% to 8%), split by economic sector as in 2024 (CAPMAS)."
  "impact": "LEP change to the baseline jobs"
  "impact_tip": "Jobs by economic sector with the LEP's jobs, minus the baseline. Reallocation: the total stays the baseline's, so the sectors the LEP demands grow and the others shrink. Expansionary: the LEP's jobs are added to the baseline."
  "reallocation": "LEP (reallocation)"
  "expansionary": "LEP (expansionary)"
  "group_energy": "Energy investments"
  "group_non_energy": "Non-energy investments"
  "unit_jobs": "jobs per year"
  "unit_jobs_change": "change in jobs"
  "unit_multiplier": "jobs per million USD"
  "missing": "No jobs data (resources/jobs/data)."
  "missing_files": "Missing in resources/jobs/data: {files}."
