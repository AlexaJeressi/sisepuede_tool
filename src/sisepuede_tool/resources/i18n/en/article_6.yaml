# Article 6 page (ui/page_article_6.py).

"article_6":
  "carbon_price": "Carbon price"
  "carbon_price_tip": "Credits are valued at the carbon price of each NDC2.0 target year. Only the target years count, so only their prices change the result."
  "change_price": "Change the carbon price"
  "reset": "Reset to reference prices"
  "instant": "The tiles, the chart and the download update right away; no new run is needed."
  "by_group": "Credits (emissions reduction) by emissions group"
