# Article 6 page (ui/page_article_6.py).

"article_6":
  "carbon_price": "Carbon price"
  "carbon_price_tip": "Credits are valued at the carbon price of each NDC2.0 target year. Only the target years count, so only their prices change the result."
  "change_price": "Change the carbon price"
  "reset": "Reset to reference prices"
  "instant": "The tiles, the chart and the download update right away; no new run is needed."
  "by_group": "Credits by emission group"
  "by_group_tip": "For each NDC2.0 target year, the value of the emissions a pathway keeps below the target of each emission group. A group above its target counts against the credits: its bar is below zero. The grey area, after {year}, is past the NDC2.0 targets."
  "empty_none": "Run a pathway that goes beyond the NDC2.0 (e.g. LEP) to see its credits."
  "empty_zero": "The pathways are exactly at the NDC2.0 target of every emission group in the target years: no credits."
  "empty_hidden": "Every emission group with credits is switched off: click a group in the legend to show it."
  "legend_hint": "Click a group to hide or show it."
  "show_all": "Show all"
  "pathways_chart": "Emissions of the pathways"
  "pathways_chart_tip": "Emissions of each pathway, summed over the emission groups that have an NDC2.0 target (the ones the credits count). The shaded band, over the target years, is the gap between the NDC2.0 pathway and a pathway that goes beyond it: green where it emits less than the NDC2.0, red where it emits more. The credit bars below compare each group with its NDC2.0 target, which sisepuede_a6 built from its own NDC2.0 run, so they follow the band only as far as the NDC2.0 pathway matches the targets. The grey area, after {year}, is past the NDC2.0 targets: the targets there carry on sisepuede_a6's NDC2.0 run."
