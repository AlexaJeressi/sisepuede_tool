  "changed": "Changed in advanced options. Reference prices: {prices}."
  "left_out": "No emissions in these runs: {groups}. Electricity and fugitive emissions need the electricity model: tick “Run electricity dispatch (NemoMod)” on the Run page."
  "not_shown": "Not shown: {names}. The NDC2.0 targets are the NDC2.0 pathway's own emissions, so only pathways with transformations beyond the NDC2.0 earn credits."
  "total_years": "Total {years}"
  "price_range": "{years}: {range}, average {avg}"
  "all_years": "All years"
  "apply_all": "Apply to every year"
  "by_year": "Change year by year"
  "by_transformer": "Credits by transformation within each sector, ranked by MAC"
  "by_transformer_tip": "The same credits as the chart above, each sector split into its transformations, ranked by their MAC within it (highest at the base), each in a lighter shade of the sector's colour (closer to it = higher MAC; the sector's own colour, in the chart above, is the strongest). A transformation that abates in several sectors is under each, with its value and MAC there. The values are sisepuede_a6's, as they are in its file. With Projects on, the strip above the chart shows the transformation under the cursor and the projects linked to it (Pathways page); the filter keeps only the transformations picked. The grey area, after {year}, is past the NDC2.0 targets."
  "by_sector_mac": "Credits by sector, ranked by MAC"
  "by_sector_mac_tip": "sisepuede_a6's ranked file (ref/temporary_a6_ranked_mac_bar_df.csv), as it is: the credit value of each year by sector (emission group), the sectors stacked by their MAC, highest at the base. A sector's MAC is its transformations' MACs in the file weighted by their share of the sector's credits (proportional_a6_excess_allocation). A click on a sector in the legend hides or shows it here and in the chart below. The grey area, after {year}, is past the NDC2.0 targets."
  "ranked_panel": "LEP"
  "ranked_missing": "The ranked MAC file of sisepuede_a6 (ref/temporary_a6_ranked_mac_bar_df.csv) was not found."
  "overall": "Credits by transformation, ranked by MAC, whole economy"
  "overall_tip": "sisepuede_a6's aggregate file (ref/temporary_a6_ranked_mac_bar_df_all_aggregate.csv), as it is: each year's credit value split among the transformations by their share of what the whole economy abates beyond the NDC2.0, ranked by their whole-economy MAC, cheapest at the base, with no subsectors. The yearly totals are those of the chart above. The grey area, after {year}, is past the NDC2.0 targets."
