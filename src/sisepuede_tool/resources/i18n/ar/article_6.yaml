  "by_group_tip": "لكل سنة مستهدفة في المساهمة المحددة وطنيًا: قيمة الانبعاثات التي يُبقيها المسار دون هدف كل مجموعة انبعاثات. المجموعة التي تتجاوز هدفها لا تحصل على أرصدة، ولا تُنقص أرصدة المجموعات الأخرى."
