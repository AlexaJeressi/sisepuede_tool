"article_6":
  "carbon_price": "سعر الكربون"
  "carbon_price_tip": "تُقيَّم الأرصدة بسعر الكربون في كل سنة مستهدفة في المساهمة المحددة وطنيًا. لا تُحتسب إلا السنوات المستهدفة، ولذلك لا تؤثر في النتيجة إلا أسعار تلك السنوات."
