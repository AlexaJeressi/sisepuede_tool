# صفحة الوظائف (ui/page_jobs.py).

"jobs":
  "intro": "الوظائف التي تتطلبها استثمارات مساري NDC2.0 وLEP، مقدّرة بنموذج المدخلات والمخرجات (EORA26)، وكيف يغيّر مسار LEP وظائف خط الأساس في مصر. الأرقام هي أرقام إحاطة مصر (resources/jobs/data)، ويعيد scripts/build_jobs_data.py إنشاءها من عمليات تشغيل جديدة."
  "multiplier": "الوظائف لكل مليون دولار مستثمر"
  "multiplier_tip": "الوظائف (المباشرة وغير المباشرة) المطلوبة في كل قطاع اقتصادي لكل مليون دولار مستثمر في كل قطاع من قطاعات SSP، وفق نموذج المدخلات والمخرجات: مجموع وظائف تحولات القطاع. يتشبع اللون عند 10."
  "demand": "الوظائف التي تتطلبها الاستثمارات"
  "demand_tip": "الوظائف التي تتطلبها استثمارات المسار (التكاليف التقنية) كل عام، حسب القطاع الاقتصادي: الوظائف لكل مليون دولار في كل قطاع من قطاعات SSP مضروبة في ما يستثمره المسار فيه في ذلك العام."
  "energy": "الاستثمارات في الطاقة وخارجها"
  "energy_tip": "الوظائف نفسها مقسّمة حسب الاستثمارات التي تأتي منها: الطاقة (المباني واحتجاز الكربون والانبعاثات المتسربة والطاقة الصناعية والكهرباء والنقل) وخارج الطاقة (قطاعات SSP الأخرى)."
  "by_ssp": "الوظائف حسب القطاع المستثمر"
  "by_ssp_tip": "الوظائف نفسها حسب قطاع SSP الذي تتطلبها استثماراته."
  "baseline": "وظائف خط الأساس"
  "baseline_tip": "وظائف مصر من دون استراتيجية LTS: السكان في سن العمل (WPP 2024 للأمم المتحدة) مضروبين في المشاركة في قوة العمل (من 45% إلى 48%) وفي التشغيل (البطالة من 9.9% إلى 8%)، موزعة حسب القطاع الاقتصادي كما في 2024 (CAPMAS)."
  "impact": "تغيير مسار LEP في وظائف خط الأساس"
  "impact_tip": "الوظائف حسب القطاع الاقتصادي مع وظائف مسار LEP، مطروحًا منها خط الأساس. إعادة التوزيع: يبقى الإجمالي كما في خط الأساس، فتنمو القطاعات التي يطلبها المسار وتنكمش الأخرى. التوسعي: تُضاف وظائف المسار إلى خط الأساس."
