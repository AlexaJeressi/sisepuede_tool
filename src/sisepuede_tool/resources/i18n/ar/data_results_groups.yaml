# Driver card text (ar); English is resources/results_groups.yaml.

"data":
  "results_groups":
    "population":
      "title": "السكان"
      "why": "يزداد معظم الطلب (الغذاء والطاقة والمخلفات) بزيادة عدد السكان."
      "unit": "مليون نسمة"
    "gdp":
      "title": "الناتج المحلي الإجمالي"
      "why": "يزداد الإنتاج الصناعي والطلب على الطاقة والنقل بنمو الناتج المحلي الإجمالي."
      "unit": "مليار دولار"
    "entc_generation":
      "title": "توليد الكهرباء حسب التقنية"
      "why": "يحدد مزيج الكهرباء انبعاثات كل كيلوواط ساعة يُستخدم في المباني والصناعة والنقل."
    "entc_capacity":
      "title": "القدرة التوليدية"
      "why": "القدرة التي يجب بناؤها (وتمويلها) لتحقيق مزيج التوليد."
    "elec_demand":
      "title": "استهلاك الكهرباء حسب القطاع"
      "why": "تنقل الكهربة الانبعاثات من الاستخدامات النهائية إلى قطاع الكهرباء."
    "transmission_loss":
      "title": "فواقد نقل الكهرباء وتوزيعها"
      "why": "الكهرباء المفقودة في الشبكة يجب توليدها على أي حال."
    "fuel_production":
      "title": "إنتاج الوقود"
      "why": "يؤدي الإنتاج المحلي من النفط والغاز إلى الانبعاثات المتسربة (التسرب والحرق في الشعلة والتنفيس)."
    "ippu_production":
      "title": "الإنتاج الصناعي"
      "why": "تزداد انبعاثات العمليات (الأسمنت والكيماويات والمعادن) بزيادة الإنتاج."
    "clinker":
      "title": "نسبة الكلنكر في الأسمنت"
      "why": "الكلنكر هو مصدر ثاني أكسيد الكربون الناتج عن عملية إنتاج الأسمنت؛ وكلما قلّ الكلنكر في الطن قلّ ثاني أكسيد الكربون."
    "inen_energy":
      "title": "استهلاك الصناعة للطاقة حسب نوع الصناعة"
      "why": "الوقود المحروق لتوليد الحرارة والطاقة في المصانع."
    "inen_fuels":
      "title": "مزيج الوقود الصناعي"
      "why": "يؤدي التحول من الوقود الأحفوري إلى الكهرباء أو الهيدروجين إلى خفض انبعاثات الاحتراق."
      "unit": "% من PJ"
    "scoe_fuels":
      "title": "طاقة المباني حسب نوع الوقود"
      "why": "يُطلق الغاز وغاز البترول المسال وأنواع الوقود الأخرى المحروقة في المنازل والمنشآت التجارية انبعاثات مباشرة، أما الكهرباء فلا."
      "unit": "% من PJ"
    "scoe_heat":
      "title": "الطلب على الحرارة حسب نوع المبنى"
      "why": "يدفع الطهي وتسخين المياه والتدفئة الاستخدام المباشر للوقود."
    "scoe_energy":
      "title": "استهلاك الطاقة في المباني"
      "why": "إجمالي الطاقة المستخدمة في المنازل والمنشآت التجارية والمباني الأخرى."
    "pkm":
      "title": "تنقل الركاب"
      "why": "الطلب على تنقل الركاب، قبل اختيار وسيلة النقل والوقود."
      "unit": "مليار راكب-كيلومتر"
    "vkm_mode":
      "title": "مركبة-كيلومتر حسب وسيلة النقل"
      "why": "المسافة التي تقطعها كل وسيلة؛ ويهيمن النقل البري على انبعاثات النقل."
      "unit": "مليار مركبة-كيلومتر"
    "vkm_electric":
      "title": "مركبة-كيلومتر بالكهرباء"
      "why": "الكيلومترات المقطوعة بالكهرباء بدلًا من البنزين أو الديزل."
      "unit": "مليار مركبة-كيلومتر"
    "trns_fuels":
      "title": "مزيج وقود النقل"
      "why": "يُطلق الديزل والبنزين انبعاثات من العادم، أما الكهرباء والهيدروجين فلا."
      "unit": "% من PJ"
    "crop_area":
      "title": "المساحة المزروعة"
      "why": "تحدد الأراضي الزراعية استخدام الأسمدة وحرق مخلفات المحاصيل وميثان الأرز."
      "unit": "مليون هكتار"
    "food_loss":
      "title": "الغذاء المفقود قبل الاستهلاك"
      "why": "الغذاء المفقود في سلسلة الإمداد كان لا بد من زراعته، وينتهي جزء منه في المدافن."
    "fertilizer":
      "title": "استخدام النيتروجين في الأسمدة"
      "why": "النيتروجين المضاف إلى التربة هو المصدر الرئيسي لأكسيد النيتروز (N₂O) الزراعي."
    "herd":
      "title": "حجم القطيع"
      "why": "يزداد التخمر المعوي وميثان السماد الحيواني بزيادة عدد الحيوانات."
      "unit": "مليون رأس"
    "manure_biogas":
      "title": "الغاز الحيوي المستخلص من السماد الحيواني"
      "why": "ميثان يُحتجز في الهاضمات بدلًا من إطلاقه في الجو."
    "land_area":
      "title": "مساحة الأراضي حسب الاستخدام"
      "why": "يؤدي تحويل الغابات والأراضي العشبية إلى إطلاق الكربون، واستعادتها تخزّنه."
      "unit": "مليون هكتار"
    "forest_stock":
      "title": "مخزون الكربون في الغابات"
      "why": "الكربون المخزَّن في الكتلة الحيوية للغابات."
    "waste_generated":
      "title": "المخلفات الصلبة المتولدة"
      "why": "تُنتج المخلفات العضوية في المدافن والمكبات غاز الميثان."
    "waste_destination":
      "title": "مصير المخلفات الصلبة"
      "why": "تُطلق المدافن والمكبات المكشوفة الميثان، بينما تتجنب إعادة التدوير والتسميد العضوي والهضم معظمه."
      "unit": "% من Mt"
    "ww_urban":
      "title": "معالجة مياه الصرف في الحضر"
      "why": "تُطلق مياه الصرف غير المعالجة ومياه صرف المراحيض ذات الحفرة الميثان، والمعالجة المتقدمة مع احتجاز الغاز الحيوي هي الأقل انبعاثًا."
      "unit": "% من السكان"
    "ww_rural":
      "title": "معالجة مياه الصرف في الريف"
      "why": "أساليب المعالجة نفسها لسكان الريف."
      "unit": "% من السكان"
