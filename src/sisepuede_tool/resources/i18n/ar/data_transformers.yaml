# Transformer text from resources/transformer_catalog.yaml (ar). Draft: needs review by an Egyptian reviewer.
# English is the catalog itself (curated value, else computed); see README.md.

data:
  transformers:
    "TFR:AGRC:DEC_CH4_RICE":
      name: "AGRC: تحسين إدارة زراعة الأرز"
      description: "خفض انبعاثات CH₄ من زراعة الأرز بنسبة 45% بفضل تحسين الإدارة وتقليل الغمر بالمياه."
      units_description: "نسبة الخفض في الميثان المنبعث من زراعة الأرز"
    "TFR:AGRC:DEC_EXPORTS":
      name: "AGRC: خفض الصادرات"
      description: "خفض الصادرات الزراعية بنسبة 50% (مقارنةً بالفترة الزمنية الأخيرة)"
      units_description: "نسبة الخفض في الصادرات الزراعية"
    "TFR:AGRC:DEC_LOSSES_SUPPLY_CHAIN":
      name: "AGRC: خفض الفاقد في سلسلة الإمداد"
      description: "خفض هدر الغذاء في سلسلة الإمداد الزراعية (المحاصيل) قبل وصوله إلى المستهلك"
      units_description: "نسبة الخفض في هدر الغذاء في سلسلة الإمداد"
    "TFR:AGRC:INC_PRODUCTIVITY":
      name: "AGRC: تحسين إنتاجية المحاصيل"
      description: "زيادة معاملات غلة المحاصيل بنسبة 20%"
      units_description: "نسبة الزيادة في إنتاجية المحاصيل (الكتلة/المساحة)"
    "TFR:AGRC:TARGET_RESIDUE_MANAGEMENT":
      name: "AGRC: أهداف إدارة المخلفات الزراعية"
      description: "تحديد أهداف نسبية لإزالة المخلفات للمحاصيل المعنية. يمكن استخدام المخلفات مصدرًا للطاقة (بدلًا من الطلب على حطب الكتلة الحيوية في ENTC)، أو علفًا للماشية (يُرسل إلى LDE)، أو حرقها، أو تركها في الحقل (مما قد يسهم في الزراعة الحافظة)."
      units_description: "نسبة المخلفات الموجهة إلى كل مسار، ويمكن تحديدها لكل محصول. يمكن أيضًا تفعيل الزراعة الحافظة، التي تتطلب ترك 30% على الأقل من المخلفات في الحقل."
    "TFR:CCSQ:INC_CAPTURE":
      name: "CCSQ: زيادة الالتقاط المباشر من الهواء"
      description: "زيادة نشر تقنيات الالتقاط المباشر للكربون من الهواء لتبلغ 50 مليون طن CO₂e بحلول الفترة الزمنية الأخيرة."
      units_description: "تحديد خارجي للقدرة المركبة لمنشآت الالتقاط المباشر من الهواء، بوحدات المتغير."
    "TFR:ENFU:ADJ_EXPORTS":
      name: "ENFU: تعديل الصادرات"
      description: "زيادة صادرات الوقود أو خفضها"
      units_description: "نسبة الزيادة (+) أو الخفض (-) في الصادرات مقارنةً بالفترة الزمنية الأخيرة."
    "TFR:ENFU:ADJ_PRICES":
      name: "ENFU: تعديل الأسعار"
      description: "زيادة أسعار الوقود أو خفضها"
      units_description: "نسبة الزيادة (+) أو الخفض (-) في الأسعار مقارنةً بالفترة الزمنية الأخيرة."
    "TFR:ENTC:DEC_LOSSES":
      name: "ENTC: خفض فواقد النقل"
      description: "خفض فواقد نقل الكهرباء من خلال تطوير البنية التحتية لشبكات النقل."
      units_description: "الحد الأقصى المستهدف لنسبة الكهرباء المنقولة التي تُفقد بسبب بنية تحتية كهربائية غير كفؤة أو غير كافية."
    "TFR:ENTC:INCREASE_EFFICIENCY_FUEL_PROD":
      name: "ENTC: زيادة كفاءة إنتاج الوقود"
      description: "خفض نسبة نشاط المدخلات في إنتاج الوقود. يُطبَّق فقط على التقنيات التي تنتج نوعًا واحدًا من الوقود. لتكرير النفط، انظر XXXX."
      units_description: "حدد مستوى الكفاءة المستهدف. على سبيل المثال، في إنتاج الفحم النباتي تبلغ القيمة الافتراضية 10%، أي نسبة نشاط مدخلات قدرها 10 (10:1)، بمعنى فقدان 90% من الكتلة الحيوية الداخلة. أما هدف 40% فيعني نسبة 2.5:1، أي فقدان 60% من الكتلة الحيوية مع الحاجة إلى كتلة حيوية أقل بأربع مرات لإنتاج الكمية نفسها من الفحم. يمكن استخدام هذا التحوّل لتمثيل تحسينات أفران الفحم، وإنتاج الغاز الطبيعي، وإنتاج الهيدروجين، وإنتاج الأمونيا، وغيرها."
    "TFR:ENTC:LEAST_COST_SOLUTION":
      name: "ENTC: الحل الأقل تكلفة"
      description: "الاكتفاء بالحل الأقل تكلفة لإنتاج الكهرباء والوقود، مع إلغاء أي قيود على الحصص المتوقعة من الإنتاج."
      units_description: "تطبيق الحل الأقل تكلفة في NEMO دون أهداف للطاقة المتجددة."
    "TFR:ENTC:TARGET_CLEAN_HYDROGEN":
      name: "ENTC: الهيدروجين النظيف"
      description: "تحديد هدف لإنتاج الهيدروجين النظيف."
      units_description: "نسبة الهيدروجين المنتج بالتحليل الكهربائي."
    "TFR:ENTC:TARGET_RENEWABLE_ELEC":
      name: "هدف الكهرباء المتجددة"
      description: "تحديد هدف للكهرباء المتجددة، يشمل أهدافًا دنيا لتقنيات طاقة متجددة بعينها."
      units_description: "تطبيق حصة مستهدفة للإنتاج من المصادر المتجددة (تُحدَّد التقنيات المتجددة في ملف المدخلات). ويمكن أيضًا تحديد حصص دنيا لتقنيات بعينها."
    "TFR:FGTV:DEC_LEAKS":
      name: "خفض التسربات"
      description: "خفض التسربات من الانبعاثات المتسربة الناتجة عن توزيع الوقود ونقله عبر الشبكات والنقل. نسبة الخفض الافتراضية 80%."
      units_description: "نسبة الخفض في تسربات CO₂ وCH₄ وN₂O من الانبعاثات المتسربة."
    "TFR:FGTV:INC_FLARE":
      name: "زيادة الحرق في الشعلة"
      description: "التحول من التنفيس إلى الحرق في الشعلة لتحويل انبعاثات الميثان إلى CO₂؛ القيمة الافتراضية 80%."
      units_description: "نسبة الغاز الذي كان سيُنفَّس ويُحرق بدلًا من ذلك في الشعلة."
    "TFR:FRST:INCREASE_SEQUESTRATION":
      name: "FRST: زيادة عزل الكربون"
      description: "زيادة العزل السنوي للكربون في الغابات"
      units_description: "نسبة الزيادة في العزل. يمكن استخدام قيم سالبة لخفضه."
    "TFR:FRST:TARGET_REMOVALS_DW":
      name: "FRST: زيادة إزالة الخشب الميت"
      description: "تحديد نسبة مستهدفة من الخشب الميت المتولد تُزال لتلبية الطلب على الإزالة. قد يؤثر ذلك في التنوع البيولوجي وصحة الغابات ومخزونات كربون التربة."
      units_description: "النسبة المستهدفة من الخشب الميت المُزال. يجب أن تكون بين 0 و1."
    "TFR:GNRL:INC_DENSITY_URBAN":
      name: "GNRL: زيادة الكثافة العمرانية"
      description: "زيادة الكثافة السكانية في المدن، بما يؤثر في المستوطنات وفي مساحة الأرض اللازمة للمناطق العمرانية."
      units_description: "نسبة الزيادة في الكثافة السكانية؛ مثلًا أدخل 20% لزيادة الكثافة بنسبة 20%. تشير القيم السالبة إلى انخفاض كثافة المناطق الحضرية."
    "TFR:INEN:INC_EFFICIENCY_ENERGY":
      name: "زيادة كفاءة الطاقة في الصناعة"
      description: "زيادة كفاءة استخدام الطاقة في عمليات الإنتاج الصناعي. القيمة الافتراضية 30%."
      units_description: "نسبة التحسن في متوسط كفاءة التقنيات الصناعية."
    "TFR:INEN:INC_EFFICIENCY_PRODUCTION":
      name: "زيادة كفاءة الإنتاج الصناعي"
      description: "زيادة كفاءة عمليات الإنتاج الصناعي (زيادة الإنتاج لكل وحدة من الطلب). القيمة الافتراضية 40%."
      units_description: "نسبة التحسن في كفاءة الإنتاج (مثل كيلوجول/طن)."
    "TFR:INEN:SHIFT_FUEL_HEAT":
      name: "INEN: تحويل الوقود في العمليات الحرارية عالية ومنخفضة الحرارة"
      description: "يجب تنفيذ تحوّلات الحرارة المنخفضة و/أو العالية باستخدام هذا المُحوِّل."
      units_description: "يمكن ضبط هذا التحوّل لتحويل 90% من الحرارة المنخفضة (إلى الكهرباء) والعالية (حسب الصناعة، إلى الكهرباء والهيدروجين)."
    "TFR:IPPU:DEC_CLINKER":
      name: "IPPU: خفض الكلنكر في الأسمنت"
      description: "خفض استخدام الكلنكر في إنتاج الأسمنت"
      units_description: "نسبة الخفض في استخدام الكلنكر في إنتاج الأسمنت."
    "TFR:IPPU:DEC_DEMAND":
      name: "IPPU: إدارة الطلب"
      description: "خفض الطلب على الإنتاج الصناعي. عند تطبيقه تكون القيمة الافتراضية 30%."
      units_description: "نسبة الخفض في الطلب على الإنتاج. ملاحظة: هذا المُحوِّل قليل الاستخدام."
    "TFR:IPPU:DEC_HFCS":
      name: "IPPU: خفض استخدام مركبات HFC"
      description: "خفض انبعاثات مركبات الهيدروفلوروكربون (HFC) في العمليات الصناعية من خلال التغيير التكنولوجي ومكافحة التسرب ووقف الاستخدام. القيمة الافتراضية 10%."
      units_description: "نسبة الخفض في معاملات انبعاث HFC لكل وحدة إنتاج."
    "TFR:IPPU:DEC_N2O":
      name: "IPPU: خفض انبعاثات أكسيد النيتروز"
      description: "خفض انبعاثات N₂O في العمليات الصناعية من خلال التغيير التكنولوجي ومكافحة التسرب ووقف الاستخدام. القيمة الافتراضية 10%."
      units_description: "نسبة الخفض في معاملات انبعاث N₂O لكل وحدة إنتاج."
    "TFR:IPPU:DEC_OTHER_FCS":
      name: "IPPU: خفض المركبات المفلورة الأخرى"
      description: "تشمل SF₆ وNF₃ وHCFC وغيرها"
      units_description: "نسبة الخفض في معاملات انبعاث المركبات المفلورة الأخرى لكل وحدة إنتاج."
    "TFR:IPPU:DEC_PFCS":
      name: "IPPU: خفض استخدام مركبات PFC"
      description: "خفض انبعاثات مركبات البيرفلوروكربون (PFC) في العمليات الصناعية من خلال التغيير التكنولوجي ومكافحة التسرب ووقف الاستخدام. القيمة الافتراضية 10%."
      units_description: "نسبة الخفض في معاملات انبعاث PFC لكل وحدة إنتاج."
    "TFR:LNDU:BOUND_CLASSES":
      name: "LNDU: تقييد فئات استخدام الأراضي"
      description: "تُقدَّر فئات استخدام الأراضي بمصفوفة انتقال وتُعدَّل ببرنامج تربيعي. يمكن بهذا التحوّل وضع حدود عليا ودنيا لفئات استخدام الأراضي القابلة للتغير، لتمثيل إنشاء محميات طبيعية عبر حد أدنى، أو منع التوسع الإضافي عبر حد أقصى."
      units_description: "مساحات الأراضي المقيدة حسب الفئة (بوحدات المتغيرين «Maximum Area» و«Minimum Area»)"
    "TFR:LNDU:DEC_CLASS_LOSS":
      name: "LNDU: الحد من فقدان فئات استخدام الأراضي"
      description: "وقف فقدان فئة محددة من استخدام الأراضي؛ وعلى غرار DEC_DEFORESTATION، يرفع احتمال بقاء الفئة على حالها. غير أن المُحوِّل DEC_DEFORESTATION يمنع تحوّل عدة فئات إلى غيرها."
      units_description: "احتمال الانتقال المستهدف لبقاء فئة استخدام الأرض على حالها (كلما اقترب من 1 قلّ الفقد)"
    "TFR:LNDU:DEC_DEFORESTATION":
      name: "الحد من إزالة الغابات"
      description: "وقف إزالة الغابات الأولية والثانوية"
      units_description: "احتمال الانتقال المستهدف لبقاء فئات الغابات على حالها (كلما اقترب من 1 قلّ الفقد)"
    "TFR:LNDU:DEC_SOC_LOSS_PASTURES":
      name: "LNDU: التوسع في ممارسات الرعي المستدام"
      description: "خفض فقدان الكربون العضوي في تربة المراعي من خلال ممارسات الرعي المستدام.\nالمراعي: رفع المعامل F_MG لـ «grasslands» إلى 1.157 (انظر الهيئة الحكومية الدولية المعنية بتغير المناخ، المجلد 4، الفصل 6، الجدول 6.2 [2019R] لمعاملات إدارة المراعي F_MG في نظم الإدارة المختلفة؛ متوسط «Improved Grassland»)"
      units_description: "نسبة المراعي التي تُطبَّق فيها ممارسات الرعي المستدام"
    "TFR:LNDU:INC_PRODUCTIVITY_PASTURES":
      name: "LNDU: زيادة إنتاجية المراعي"
      description: "زيادة متوسط غلة المادة الجافة في المراعي، بحد أقصى هو أعلى غلة ممكنة للمراعي (المحددة في «Maximum Pasture Dry Matter Yield Factor»)، والتي يحددها عادةً مستوى الري والمناخ."
      units_description: "نسبة الزيادة المستهدفة في متوسط غلة المادة الجافة."
    "TFR:LNDU:INC_REFORESTATION":
      name: "LNDU: زيادة إعادة التشجير"
      description: "زيادة احتمال تحوّل فئات استخدام الأراضي المحددة إلى غابات ثانوية. يمكن تحديد هذا التحوّل لفئات بعينها، مثل تحويل الأراضي الشجيرية والزراعية فقط إلى"
      units_description: "نسبة الزيادة المستهدفة في مساحة الغابات"
    "TFR:LNDU:INC_SILVOPASTURE":
      name: "LNDU: التوسع في الرعي الحراجي"
      description: "زيادة استخدام الرعي الحراجي برفع متوسط معامل عزل الكربون المرتبط بالمراعي. يمثّل هذا المُحوِّل الرعي الحراجي كنسبة من المراعي المزروعة بالأشجار. ولأن القيمة نسبة من المساحة، يُقدَّر متوسط معامل العزل بـ m*f، حيث m هي القيمة (مدى الانتشار) وf معامل عزل الكربون للغابات الثانوية."
      units_description: "نسبة المراعي الخاضعة للرعي الحراجي. تُطبَّق على مساحتها معاملات عزل الكربون للغابات الثانوية."
    "TFR:LNDU:PLUR":
      name: "LNDU: إعادة توزيع جزئية لاستخدام الأراضي"
      description: "ضبط معامل إعادة توزيع استخدام الأراضي على 0.5"
      units_description: "يتراوح معامل إعادة التوزيع بين 0 و1، ويمثّل مدى استجابة استخدام الأراضي للطلب الزراعي الخارجي (المحاصيل والماشية). القيمة 1 استجابة كاملة (قوة سوقية كاملة)، والقيمة 0 انعدام الاستجابة (مثل التخطيط المركزي لاستخدام الأراضي)."
    "TFR:LSMM:INC_CAPTURE_BIOGAS":
      name: "LSMM: زيادة التقاط الغاز الحيوي في منشآت التحلل اللاهوائي"
      description: "زيادة نسبة الغاز الحيوي الملتقط من الروث المعالج في منشآت المعالجة اللاهوائية لروث الماشية"
      units_description: "الحد الأدنى المستهدف لنسبة الغاز الحيوي الملتقط من منشآت إدارة الروث ذات التحلل اللاهوائي (بما فيها البحيرات)"
    "TFR:LSMM:INC_MANAGEMENT_CATTLE_PIGS":
      name: "LSMM: تحسين إدارة روث الأبقار والخنازير"
      description: "يُعالَج 95% من روث الأبقار (الحلوب وغير الحلوب) والخنازير. في الظروف الافتراضية يُوجَّه الروث المعالج إلى:\n37.5% الهضم اللاهوائي\n12.5% التسميد العضوي (الكمر)\n25.0% النشر اليومي\n12.5% الفرشة العميقة\n12.5% التخزين الصلب"
      units_description: "نسب روث الأبقار والخنازير المدارة بكل نظام من نظم إدارة الروث (LSMM). يمكن تحديد أي نظام مستهدف."
    "TFR:LSMM:INC_MANAGEMENT_OTHER":
      name: "LSMM: تحسين إدارة روث الحيوانات الأخرى"
      description: "يُعالَج 95% من روث سائر الحيوانات. ويُوجَّه الروث المعالج إلى:\n37.5% التسميد العضوي (الكمر)\n12.5% الحظائر الجافة\n25.0% النشر اليومي\n25.0% التخزين الصلب"
      units_description: "نسب روث الحيوانات غير الأبقار والخنازير والدواجن المدارة بكل نظام من نظم إدارة الروث (LSMM). يمكن تحديد أي نظام مستهدف."
    "TFR:LSMM:INC_MANAGEMENT_POULTRY":
      name: "LSMM: تحسين إدارة زرق الدواجن"
      description: "يُعالَج 95% من روث الدواجن (الدجاج) والخنازير. ويُوجَّه الروث المعالج إلى:\n100% إدارة زرق الدواجن"
      units_description: "نسب زرق الدواجن المدار بكل نظام من نظم إدارة الروث (LSMM). يمكن تحديد أي نظام مستهدف."
    "TFR:LVST:DEC_ENTERIC_FERMENTATION":
      name: "LVST: خفض التخمر المعوي"
      description: "خفض التخمر المعوي باستخدام إضافات الأعلاف ولقاحات مضادة للميكروبات المنتجة للميثان وغيرها من العمليات والتكيفات التكنولوجية.\nملاحظة: لا يشمل ذلك تغيير الأعلاف، الذي يتناوله تحوّل تغيير النظام الغذائي."
      units_description: "نسبة الخفض في التخمر المعوي لجميع الفئات"
    "TFR:LVST:DEC_EXPORTS":
      name: "LVST: خفض الصادرات"
      description: "خفض صادرات الماشية والمنتجات الحيوانية بنسبة 50% (مقارنةً بالفترة الزمنية الأخيرة)"
      units_description: "نسبة الخفض في صادرات الماشية"
    "TFR:LVST:INC_PRODUCTIVITY":
      name: "LVST: زيادة إنتاجية الماشية"
      description: "زيادة الطاقة الاستيعابية المقدّرة للماشية بنسبة 20%"
      units_description: "نسبة الزيادة في إنتاجية الماشية"
    "TFR:LVST:SHIFT_DIETARY_BOUNDS":
      name: "LVST: تغيير النظام الغذائي للماشية"
      description: "تعديل حدود النظام الغذائي للماشية لتعكس المستويات الدنيا والقصوى المرغوبة. تتوفر أربعة خيارات للعلف: محاصيل الحبوب، والمحاصيل غير الحبوب، ومخلفات المحاصيل، والمراعي. ويُحدَّد مزيج المحاصيل المتاحة علفًا بنسبة كل محصول المخصصة للعلف. وتؤثر تغيرات النظام الغذائي في الطلب على الأراضي والتخمر المعوي والنيتروجين في الروث."
      units_description: "لكل نوع من الماشية يمكن تحديد نسب قصوى و/أو دنيا لكل نوع من العلف. ولفئة الماشية الواحدة، لا يجوز أن يتجاوز مجموع النسب الدنيا 1، ولا أن يقل مجموع النسب القصوى عن 1. وتُحسب نسب النظام الغذائي بأداة تقدير النظام الغذائي للماشية (LDE)."
    "TFR:PFLO:INC_HEALTHIER_DIETS":
      name: "PFLO: تغيير أنماط الغذاء"
      description: "يشمل خفض الطلب على اللحوم الحمراء ويتيح تغيير الطلب على المحاصيل المختلفة."
      units_description: "الحد الأقصى المستهدف لنسبة نصيب الفرد من الطلب على اللحوم الحمراء (الأبقار)."
    "TFR:PFLO:INC_IND_CCS":
      name: "PFLO: احتجاز الكربون وتخزينه في الصناعة"
      description: "تطبيق احتجاز الكربون في المنشآت الصناعية، بما يؤثر في انبعاثات INEN وIPPU. حدد الحد الأدنى المستهدف لنسبة المنشآت الصناعية التي تستخدم احتجاز الكربون (مدى الانتشار) والفعالية المستهدفة للاحتجاز في تلك المنشآت."
      units_description: "الحد الأدنى المستهدف لنسبة المنشآت الصناعية التي تستخدم احتجاز الكربون (مدى الانتشار) والفعالية المستهدفة للاحتجاز في تلك المنشآت."
    "TFR:SCOE:DEC_DEMAND_HEAT":
      name: "SCOE: خفض الطلب النهائي على الطاقة الحرارية بتحسين غلاف المباني"
      description: "خفض الطلب على الطاقة الحرارية (الطهي والتدفئة) في المباني السكنية والتجارية من خلال العزل الحراري وتحسين المباني. القيمة الافتراضية 50%."
      units_description: "نسبة التغير في الطلب على الحرارة في المباني."
    "TFR:SCOE:INC_EFFICIENCY_APPLIANCE":
      name: "SCOE: زيادة كفاءة الأجهزة الكهربائية"
      description: "زيادة كفاءة الأجهزة الكهربائية في المباني السكنية والتجارية من خلال التقدم التكنولوجي (مثل برامج ولوائح كفاءة الطاقة). القيمة الافتراضية 50%."
      units_description: "نسبة الزيادة في كفاءة الأجهزة الكهربائية في المباني (السكنية والتجارية/الحكومية)."
    "TFR:SCOE:INC_EFFICIENCY_HEAT":
      name: "SCOE: زيادة كفاءة التدفئة"
      description: "زيادة كفاءة تقنيات الحرارة في المباني السكنية والتجارية من خلال التقدم التكنولوجي (مثل برامج ولوائح كفاءة الطاقة). القيمة الافتراضية 20%."
      units_description: "نسبة الزيادة في كفاءة تقنيات توفير الحرارة في المباني (السكنية والتجارية/الحكومية). الحد الأقصى لكفاءة التقنيات غير الكهربائية هو 1."
    "TFR:SCOE:SHIFT_FUEL_HEAT":
      name: "SCOE: التحول إلى الكهرباء للحرارة باستخدام المضخات الحرارية والمواقد الكهربائية وغيرها"
      description: "تحويل الطاقة المستخدمة في التدفئة والطهي إلى أنواع وقود أخرى عبر التحول التكنولوجي. الافتراضي تحويل 95% إلى الكهرباء."
      units_description: "نسبة الطاقة الحرارية المحوَّلة إلى الكهرباء."
    "TFR:SOIL:DEC_LIME_APPLIED":
      name: "SOIL: تحسين إضافة الجير"
      description: "خفض كمية الجير المضافة إلى التربة (5% افتراضيًا)"
      units_description: "نسبة الخفض في الجير المضاف إلى التربة"
    "TFR:SOIL:DEC_N_APPLIED":
      name: "SOIL: تحسين إضافة الأسمدة"
      description: "خفض إجمالي النيتروجين المضاف من خلال استخدام أدق للأسمدة (5% افتراضيًا)"
      units_description: "نسبة الخفض في نيتروجين الأسمدة المضاف إلى التربة"
    "TFR:TRDE:DEC_DEMAND":
      name: "TRDE: خفض الطلب على النقل"
      description: "خفض الطلب على النقل من خلال تخطيط وبنية تحتية أفضل. القيمة الافتراضية 25%."
      units_description: "نسبة الخفض في إجمالي الطلب على النقل حسب نوع الطلب في TRDE (مثل public_private أو regional أو freight)"
    "TFR:TRNS:INC_EFFICIENCY_ELECTRIC":
      name: "TRNS: زيادة كفاءة الطاقة في النقل الكهربائي"
      description: "زيادة كفاءة المركبات الكهربائية (مثل خفض كيلوواط ساعة/كم). القيمة الافتراضية 25%."
      units_description: "نسبة الزيادة في كفاءة المركبات الكهربائية مقارنةً بالفترة الزمنية الأخيرة."
    "TFR:TRNS:INC_EFFICIENCY_NON_ELECTRIC":
      name: "TRNS: زيادة كفاءة الطاقة في النقل غير الكهربائي"
      description: "زيادة كفاءة المركبات غير الكهربائية (مثل زيادة كم/لتر). القيمة الافتراضية 25%."
      units_description: "نسبة الزيادة في كفاءة المركبات غير الكهربائية مقارنةً بالفترة الزمنية الأخيرة"
    "TFR:TRNS:INC_OCCUPANCY_LIGHT_DUTY":
      name: "TRNS: زيادة إشغال المركبات الخاصة"
      description: "زيادة إشغال المركبات الخفيفة، مثلًا عبر المشاركة في الرحلات. القيمة الافتراضية 25%."
      units_description: "نسبة الزيادة في متوسط معدل إشغال المركبات الخاصة."
    "TFR:TRNS:SHIFT_FUEL_LIGHT_DUTY":
      name: "TRNS: كهربة النقل البري الخفيف"
      description: "تحويل وقود المركبات الخفيفة إلى مصادر أقل كثافة كربونية. الافتراضي تحويل 70% إلى الكهرباء."
      units_description: "الحد الأدنى المستهدف لنسبة المركبات الخفيفة العاملة بالكهرباء. يمكن استخدامه لاستكشاف تحولات وقود أخرى عبر قاموس."
    "TFR:TRNS:SHIFT_FUEL_MARITIME":
      name: "TRNS: تحويل الوقود في النقل البحري"
      description: "تحويل وقود النقل البحري (القوارب والسفن) إلى مصادر أقل كثافة كربونية. الافتراضي تحويل 70% إلى الهيدروجين."
      units_description: "الحد الأدنى المستهدف لنسبة النقل البحري العامل بالهيدروجين. يمكن استخدامه لاستكشاف أنواع وقود أخرى، مثل الأمونيا، عبر قاموس."
    "TFR:TRNS:SHIFT_FUEL_MEDIUM_DUTY":
      name: "TRNS: تحويل الوقود في النقل البري المتوسط"
      description: "تحويل وقود المركبات المتوسطة إلى مصادر أقل كثافة كربونية. الافتراضي تحويل 70% إلى الكهرباء."
      units_description: "الحد الأدنى المستهدف لنسبة النقل المتوسط العامل بالكهرباء. يمكن استخدامه لاستكشاف تحولات وقود أخرى عبر قاموس."
    "TFR:TRNS:SHIFT_FUEL_RAIL":
      name: "TRNS: كهربة السكك الحديدية"
      description: "تحويل وقود السكك الحديدية (البضائع والركاب) إلى مصادر أقل كثافة كربونية. الافتراضي تحويل 25% إلى الكهرباء."
      units_description: "الحد الأدنى المستهدف لنسبة السكك الحديدية العاملة بالكهرباء. يمكن استخدامه لاستكشاف تحولات وقود أخرى عبر قاموس."
    "TFR:TRNS:SHIFT_MODE_FREIGHT":
      name: "TRNS: تحويل نمط نقل البضائع"
      description: "تحويل نسبة من الطلب على نقل البضائع إلى أنماط أخرى. الافتراضي تحويل 20% من النقل الجوي والبري إلى السكك الحديدية."
      units_description: "حدد نسبة خفض في متوسط معامل تصحيح الميثان في المدافن الصحية. يمكن استخدامه لتمثيل التحول إلى مدافن شبه هوائية. القيم السالبة _ترفع_ معامل تصحيح الميثان (MCF)، بما يمثل التحول إلى مدافن لاهوائية."
      magnitude_help: "نسبة البضائع المحوَّلة عن الأنماط المختارة (افتراضيًا النقل الجوي والبري الثقيل) بحلول السنة الأخيرة."
    "TFR:TRNS:SHIFT_MODE_PASSENGER":
      name: "TRNS: تحويل الركاب من المركبات الخفيفة إلى أنماط أخرى"
      description: "تحويل نسبة من الطلب اليومي على تنقل الركاب إلى أنماط أخرى. الافتراضي تحويل 30% من السيارات الخفيفة إلى التنقل الكهربائي الخفيف والمشي والدراجات والنقل العام."
      units_description: "نسبة الطلب على تنقل الركاب المحوَّلة من الراكب-كم في المركبات البرية الخفيفة إلى أنماط أخرى (افتراضيًا التنقل النشط والخفيف). يمكن استكشاف تحولات إضافية عبر قاموس."
    "TFR:TRNS:SHIFT_MODE_REGIONAL":
      name: "TRNS: تحويل نمط السفر الإقليمي للركاب"
      description: "تحويل نسبة من الطلب الإقليمي على تنقل الركاب إلى أنماط أخرى. الافتراضي تحويل 10% من النقل الجوي و20% من الطلب الإقليمي على المركبات الخفيفة إلى قطارات الركاب."
      units_description: "نسبة الطلب الإقليمي على تنقل الركاب المحوَّلة من الراكب-كم في المركبات البرية الخفيفة والنقل الجوي إلى النقل البري الثقيل."
    "TFR:TRWW:INC_CAPTURE_BIOGAS":
      name: "TRWW: زيادة التقاط الغاز الحيوي"
      description: "التقاط الغاز الحيوي في محطات معالجة مياه الصرف. مستوى الالتقاط الافتراضي 85%."
      units_description: "الحد الأدنى المستهدف لنسبة محطات المعالجة اللاهوائية لمياه الصرف المزودة بالتقاط الغاز الحيوي."
    "TFR:TRWW:INC_COMPLIANCE_SEPTIC":
      name: "TRWW: زيادة امتثال خزانات الصرف الصحي"
      description: "زيادة امتثال خزانات الصرف الصحي المستخدمة؛ إذ يقلل الامتثال الانبعاثات الناتجة عن التسرب والفيضان ومياه الصرف الراكدة."
      units_description: "الحد الأدنى المستهدف لنسبة خزانات الصرف الصحي الممتثلة امتثالًا كاملًا."
    "TFR:WALI:INC_TREATMENT_INDUSTRIAL":
      name: "WALI: تحسين معالجة مياه الصرف الصناعي"
      description: "زيادة معالجة مياه الصرف الصناعي. يوجّه المسار الافتراضي 80% من مياه الصرف الصناعي إلى المعالجة الثلاثية اللاهوائية، و10% إلى المعالجة الثانوية الهوائية، و10% إلى المعالجة الثانوية اللاهوائية."
      units_description: "الحد الأدنى المستهدف لمزيج مسارات معالجة مياه الصرف في المنشآت الصناعية. يمكن تحديد أي مسار مستهدف."
    "TFR:WALI:INC_TREATMENT_RURAL":
      name: "WALI: تحسين معالجة مياه الصرف في الريف"
      description: "زيادة معالجة مياه الصرف في الريف. يوجّه المسار الافتراضي 100% من مياه الصرف الريفية إلى خزانات الصرف الصحي."
      units_description: "الحد الأدنى المستهدف لمزيج مسارات معالجة مياه الصرف في المناطق الريفية. يمكن تحديد أي مسار مستهدف."
    "TFR:WALI:INC_TREATMENT_URBAN":
      name: "WALI: تحسين معالجة مياه الصرف في الحضر"
      description: "زيادة معالجة مياه الصرف في الحضر. يوجّه المسار الافتراضي 30% من مياه الصرف إلى المعالجة الثلاثية اللاهوائية، و30% إلى المعالجة الثلاثية الهوائية، و20% إلى المعالجة الثانوية الهوائية، و20% إلى المعالجة الثانوية اللاهوائية."
      units_description: "الحد الأدنى المستهدف لمزيج مسارات معالجة مياه الصرف في المناطق الحضرية. يمكن تحديد أي مسار مستهدف."
    "TFR:WASO:DEC_CONSUMER_FOOD_WASTE":
      name: "WASO: خفض هدر الغذاء لدى المستهلكين"
      description: "خفض كمية هدر الغذاء المتولدة لكل فرد"
      units_description: "نسبة الخفض في هدر الغذاء المتولد لكل فرد مقارنةً بالفترة الزمنية الأخيرة"
    "TFR:WASO:DEC_MCF_LANDFILLS":
      name: "WASO: خفض متوسط معامل تصحيح الميثان في المدافن الصحية"
      description: "حدد نسبة خفض في متوسط معامل تصحيح الميثان في المدافن الصحية. يمكن استخدامه لتمثيل التحول إلى مدافن شبه هوائية. القيم السالبة _ترفع_ معامل تصحيح الميثان (MCF)، بما يمثل التحول إلى مدافن لاهوائية."
      units_description: "حدد نسبة خفض في متوسط معامل تصحيح الميثان في المدافن الصحية. يمكن استخدامه لتمثيل التحول إلى مدافن شبه هوائية. القيم السالبة _ترفع_ معامل تصحيح الميثان (MCF)، بما يمثل التحول إلى مدافن لاهوائية."
    "TFR:WASO:INC_ANAEROBIC_AND_COMPOST":
      name: "WASO: زيادة التسميد العضوي والغاز الحيوي"
      description: "زيادة نسبة مخلفات الحدائق والطعام والحمأة المعالجة في المخمرات اللاهوائية أو بالتسميد العضوي"
      units_description: "أهداف نسبية للمخلفات العضوية المعالجة بالتسميد العضوي والمخمرات اللاهوائية. يمكن تحديد نسب مختلفة."
    "TFR:WASO:INC_CAPTURE_BIOGAS":
      name: "WASO: زيادة التقاط الغاز الحيوي"
      description: "زيادة نسبة الغاز الحيوي الملتقط من المدافن الصحية والمخمرات اللاهوائية"
      units_description: "الحد الأدنى المستهدف لنسبة منشآت التخلص اللاهوائي من المخلفات الصلبة (المدافن والمخمرات) المزودة بالتقاط الغاز الحيوي."
    "TFR:WASO:INC_ENERGY_FROM_BIOGAS":
      name: "WASO: الغاز الحيوي لإنتاج الطاقة"
      description: "زيادة نسبة الغاز الحيوي المجمّع المستخدم في إنتاج الطاقة"
      units_description: "الحد الأدنى المستهدف لنسبة الغاز الحيوي الملتقط المستخدم في إنتاج الطاقة."
    "TFR:WASO:INC_ENERGY_FROM_INCINERATION":
      name: "WASO: الحرق لإنتاج الطاقة"
      description: "زيادة نسبة المخلفات المحروقة التي تُستغل في إنتاج الطاقة. النسبة الافتراضية 85%."
      units_description: "الحد الأدنى المستهدف لنسبة المخلفات المحروقة لإنتاج الطاقة."
    "TFR:WASO:INC_LANDFILLING":
      name: "WASO: زيادة الدفن الصحي"
      description: "زيادة نسبة المخلفات غير المعالجة بطرق أخرى (أي بعد إعادة التدوير والتسميد العضوي وغيرها) التي تُرسل إلى المدافن الصحية"
      units_description: "النسبة المستهدفة من المخلفات التي لا يُعاد تدويرها بطرق أخرى (بما في ذلك التسميد العضوي للمخلفات العضوية) والتي تُرسل إلى المدافن الصحية."
    "TFR:WASO:INC_RECYCLING":
      name: "WASO: زيادة إعادة التدوير"
      description: "زيادة كمية المخلفات القابلة للتدوير التي يُعاد تدويرها؛ وتشمل مخلفات الطعام والحدائق التي تُرسل إلى التسميد العضوي. القيمة الافتراضية 95%."
      units_description: "النسبة المستهدفة من المخلفات التي يُعاد تدويرها (تُحوَّل المخلفات العضوية ومخلفات الحدائق إلى سماد عضوي)."
