  "by_subsector": "متوسط تكلفة الخفض، حسب القطاع الفرعي"
  "by_subsector_tip": "لكل قطاع فرعي، متوسط تكلفة طن مكافئ ثاني أكسيد الكربون الذي يتم خفضه فيه، والأرخص على اليسار: تكلفة الطن لكل تحول يخفض فيه، مرجّحة بالأطنان التي يخفضها فيه. تحت الصفر، يوفر الخفض أكثر مما يكلف. فوق كل عمود، الانبعاثات التي يتم خفضها فيه (MtCO₂e). للتحول تكلفة واحدة لكل طن، وهي تكلفته الصافية الكاملة مقسومة على كل ما يخفضه. ‏tornado وwhirlpool تقديران من مجموعتين مختلفتين من عمليات التشغيل، والمتوسط يجمعهما معًا."
  "by_transformation": "تكلفة الخفض، حسب التحول"
  "by_transformation_tip": "التحولات التي تخفض في كل قطاع فرعي، الأرخص أولًا، بترتيب القطاعات الفرعية في الرسم أعلاه. التحول الذي يخفض في عدة قطاعات فرعية يظهر تحت كل منها، بالتكلفة نفسها لكل طن وما يخفضه هناك (بعد العمود، MtCO₂e). نسختا NDC وLEP من التحول تتشاركان صفًا واحدًا."
